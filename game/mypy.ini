# mypy settings for this game. Each game folder carries its own copy, because every Evennia
# game has top-level packages with the same names (typeclasses, commands, world...) and mypy
# can only check one game at a time. Run from inside this folder: `uv run mypy .`
# The VS Code mypy extension finds this file too (cwd = ${nearestConfig}).

[mypy]
python_version = 3.12
strict = True
# This folder is the import root, like on Evennia's sys.path (typeclasses.rooms, not game...).
explicit_package_bases = True
# Evennia base classes are untyped (Any), so subclassing them must be allowed.
disallow_subclassing_any = False
# settings.py is a star import of Evennia's defaults by design; static/ holds no Python.
exclude = (^|/)server/conf/settings[.]py$|(^|/)web/static/

# Evennia and Django ship no type hints. Treat them as Any instead of failing the strict check.
[mypy-evennia.*,django.*,twisted.*]
ignore_missing_imports = True
follow_imports = skip
