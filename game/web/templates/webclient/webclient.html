{% extends "webclient/base.html" %}
{% load static %}
<!--
Terrific Travel: replaces Evennia's evennia/web/templates/webclient/webclient.html.
The "client" block is copied unchanged from Evennia 6.1; the only addition is the
picture_map.js plugin in the "scripts" block (the Map pane and room pictures).
-->

{% block client %}

<!-- Basic toolbar -->
<div id="toolbar"></div>

<!-- "Main" Content -->
<div id="main"  class="split split-vertical" data-role-default>
  <div id="main-sub" class="split-sub">
    <div id="messagewindow"></div>
  </div>
</div>

<!-- "Input" Pane -->
<div id="input" class="split split-vertical" data-role-input data-update-append>
  <div id="inputform" class="wrapper">
    <div id="prompt" class="prompt">
    </div>
    <div id="inputcontrol" class="input-group">
      <textarea id="inputfield" type="text" class="form-control"></textarea>
      <span class="input-group-btn">
        <button class="btn btn-large btn-outline-primary" id="inputsend" type="button" value="">&gt;</button>
      </span>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src={% static "webclient/js/plugins/picture_map.js" %} language="javascript" type="text/javascript"></script>
{% endblock %}
