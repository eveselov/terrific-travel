[project]
name = "terrific-travel"
version = "0.0.1"
description = "Terrific Travel: a text-based multiplayer adventure game built on Evennia."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"  # Evennia 6.x requires Python 3.12+
dependencies = [
    "evennia>=6.1,<7",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.uv]
# The repo is an Evennia game directory, not an installable library: uv only manages the
# environment. Evennia puts game/ on sys.path itself when the server starts.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Every game folder at the root is an Evennia game dir, which Evennia puts on sys.path, so its
# packages (typeclasses, world...) are first-party. List each game here.
src = ["game"]
# Each game's settings.py is a star import of Evennia's defaults by design.
extend-exclude = ["*/server/conf/settings.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
# Evennia objects are untyped, so `Any` is often the honest annotation at the framework boundary.
ignore = ["ANN401"]

# mypy settings live in each game's own mypy.ini (game/mypy.ini): games share module names
# (typeclasses, world...), so mypy checks one game at a time, run from inside its folder.
