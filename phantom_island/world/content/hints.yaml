# Hints: the next step, for a player who asks (`hint`) or who goes long without progress.
#
# SPOILERS: this file holds the way through the mystery. Don't show it to the players.
#
# No dead ends (DECISIONS.md, 6b and 31): `hint` gives the next step at three levels. The
# first `hint` is a nudge (where to look), the second is more direct (what to do), the third
# gives the exact command. The level starts over whenever the expedition makes progress (a
# new clue in the journal, or a question of the report answered). A player who goes
# `push_after` commands without progress gets the first level after the last of them,
# once per stretch without progress (commands, not minutes: playtest 2026-11-25).
#
# Who speaks: aboard, the Ship; anywhere else, the journal, as the expedition's own
# thinking. So write hints as plain advice that suits both ("The compass is worth a closer
# look"), with no "I" and no "you remember me saying".
#
# The situations are checked in order, and the first that matches gives the hint. Each has:
#   id       a short name
#   ship     optional: the ship's positions where it applies (ship.yaml)
#   needs    optional: clue ids or flags that must all be found or set
#   missing  optional: clue ids or flags none of which may be found or set yet
#   unanswered  optional: a report question id (report.yaml) still open
#   answered    optional: true when every question of the report is answered
#   hints    three texts, the first a nudge, the last the exact command
#
# When a gate or a timed event is added, add its situation here too, with at least one way
# through (DECISIONS.md, 6b). After editing, `reload` in the game is enough.

push_after: 20
voices:
  aboard: 'The Good Hope creaks: "{hint}"'
  ashore: "You leaf through the journal, and think. {hint}"

situations:
  - id: complete
    answered: true
    hints:
      - The report is complete. The whole story is in the epilogue.
      - Type report to read the epilogue again, or journal to see everything found.
      - "|wreport|n"

  - id: under_way
    ship: [under_way]
    hints:
      - The ship is under way. There's nothing to do but watch.
      - The crew sail her. Wait until she arrives.
      - Wait a few moments, then |wlook|n.

  # --- Act 1: the port --------------------------------------------------------------------

  - id: briefing
    ship: [port]
    missing: [briefed]
    hints:
      - The Society called you here. Mrs. Fairweather will tell you what it wants.
      - Ask Mrs. Fairweather about the mission, in the Society Office. (Still on the title page? Type |wbegin|n.)
      - Type |wbegin|n if you're still on the title page. Then, in the Society Office, type |wask fairweather about mission|n.

  - id: compass
    ship: [port]
    missing: [C1]
    hints:
      - Mrs. Fairweather spoke of a compass in the market. That's the place to start.
      - The compass is on Silas Crane's stall in the Market, east of the Society Office.
        Look at it.
      - In the Market, type |wlook compass|n.

  - id: coral
    ship: [port]
    missing: [C2]
    hints:
      - The compass is worth a closer look than a glance.
      - Look very closely at the compass in the Market, at its hinge.
      - In the Market, type |wexamine compass|n.

  - id: crane
    ship: [port]
    missing: [C3]
    hints:
      - The coral in the compass hinge says it lay in the sea for years, not on a beach.
        Silas Crane may tell it differently now.
      - Ask Silas Crane about the compass again, now that the coral is in the journal.
      - In the Market, type |wask crane about compass|n.

  - id: sail_out
    ship: [port]
    hints:
      - The Society's task waits at the island on the Halcyon's chart. Time to sail. Not
        sure how? Call a council aboard.
      - The island's position is written on the Halcyon's chart, in the ship's chart
        house. Read it, then give the order.
      - Go |waboard|n, |wread chart|n, and type |wsail to 14 south 40 west|n.

  # --- Act 2: at sea ----------------------------------------------------------------------

  - id: check_reckoning
    ship: [charted]
    missing: [sight_charted]
    hints:
      - No island where the chart puts it. First make sure the ship is really at the
        chart's position.
      - Measure the noon sun's height with the sextant, then read the chronometer.
      - On the Deck, |wuse sextant|n, then |wread chronometer|n.

  # The decision at the chart's position follows its council (councils.yaml, DECISIONS.md,
  # 35): one situation per step, each pointing to the council first.
  - id: council_line
    ship: [charted]
    missing: [line_settled]
    hints:
      - Both of the chart's numbers check out by the ship's reckoning, and still no island.
        A big decision like this is best talked over, one question at a time.
      - Call a council aboard. The Good Hope will ask the questions; the first is which of the
        chart's numbers could be wrong.
      - Type |wcouncil|n. Latitude was measured by the noon sun every day; longitude was a
        reckoning.

  - id: council_side
    ship: [charted]
    missing: [side_settled]
    hints:
      - East or west? Something out here knows where land is.
      - Watch the seabirds from the Deck in the evening. Which way do they fly home? Then
        go on with the council.
      - On the Deck, |wlook sky|n. Then |wcouncil|n again.

  - id: council_far
    ship: [charted]
    missing: [far_settled]
    hints:
      - How far? Terns fish a long way from land, but not without limit, and a lookout sees
        far, but not without limit.
      - Ask the Good Hope how far terns fish, and how far a lookout sees. Then work it out in
        degrees, and go on with the council.
      - "|wask hope about birds|n and |wask hope about horizon|n, then |wcouncil|n again."

  - id: which_way
    ship: [charted]
    hints:
      - The council has decided. The order is yours.
      - Sail west along this latitude, about one degree.
      - On the Deck, type |wsail to 14 south 41 west|n.

  - id: wrong_way
    ship: [north_of_chart, south_of_chart, east_of_chart]
    hints:
      - No island here either. This wasn't the way.
      - Go back to the chart's position and think again about which way to search.
      - "On the Deck, type |wsail|n: it names the way back to the chart's position."

  # --- Act 3: the island ------------------------------------------------------------------

  # One way through, always signposted (DECISIONS.md, 39): paths are learned (40) and
  # Elder Ama's respect is earned on purpose (41), in this order.
  - id: go_ashore
    ship: [anchorage]
    missing: [village_seen]
    hints:
      - An island at last. From somewhere high, you could see all of it.
      - Go ashore, follow the path up through the forest to the Hilltop, and look around.
      - On the Deck, type |washore|n. Then |wnorthwest|n, and |wnorth|n to the Hilltop.

  - id: village
    ship: [anchorage]
    missing: [respect_rule]
    hints:
      - The people of the Village know this island, but they don't tell strangers much until they trust them.
      - In the Village, south of the Forest Path, ask Tui how a stranger earns respect there.
      - In the Village, type |wask tui about respect|n.

  - id: respect_ama
    ship: [anchorage]
    missing: [respect_ama]
    hints:
      - Elder Ama expects respect from strangers, before she tells them anything.
      - Show her respect. Ask Elder Ama about her people and her village.
      - In the Village, type |wask ama about village|n.

  - id: respect_tui
    ship: [anchorage]
    missing: [respect_tui]
    hints:
      - Elder Ama watches how strangers treat the village children.
      - Listen to Tui's song, all the way through.
      - In the Village, type |wask tui about song|n.

  - id: reef
    ship: [anchorage]
    missing: [C7]
    hints:
      - Tui showed you the way to the big bones, out on the Western Reef.
      - Walk out to the Western Reef, west of the Village, and look at what lies there.
      - On the Western Reef, type |wlook bones|n.

  - id: ama_story
    ship: [anchorage]
    missing: [C12]
    hints:
      - Elder Ama trusts you now. Ask her what you came to ask.
      - Ask Elder Ama about the Halcyon, the ship on the reef.
      - In the Village, type |wask ama about halcyon|n.

  - id: jonah
    ship: [anchorage]
    missing: [C13]
    hints:
      - Elder Ama told you where the one who stayed lives.
      - Find Jonah Pike at the Boat Cove, southwest of the Village, and ask him about the
        Halcyon.
      - At the Boat Cove, type |wask jonah about halcyon|n.

  - id: beams
    ship: [anchorage]
    missing: [C8]
    hints:
      - One of the village huts is built with an unusual timber.
      - Look closely at the beams of the big hut in the Village. The plant guide helps too.
      - In the Village, type |wexamine beams|n.

  - id: stayed
    ship: [anchorage]
    missing: [C9]
    hints:
      - Some things on this island don't belong on an island like this.
      - Take the guides from the chart house, and look at what grows by the Spring and
        what grazes above the Lagoon Beach.
      - Carry the animal guide (|wget animal guide|n), and on the Lagoon Beach, type
        |wlook goats|n.

  # The final council (councils.yaml, DECISIONS.md, 37): with the evidence found, back
  # aboard to put it together, then the report. Players who answer the report directly
  # skip it (offered, never forced). Before the coastline and the position, which the
  # council doesn't need: the hint and the council's own line agree (playtest 2026-11-26).
  - id: island_council
    ship: [anchorage]
    missing: [crew_settled]
    unanswered: crew
    hints:
      - The island has told you a lot. Time to put it together, aboard, with the Good Hope.
      - Go back aboard and call a council. The Good Hope will ask the Society's questions one
        at a time.
      - From the Lagoon Beach, type |waboard|n, then |wcouncil|n.

  - id: coastline
    ship: [anchorage]
    missing: [C10]
    hints:
      - Is this really the island on the Halcyon's chart?
      - Take the Halcyon's chart from the chart house, aboard, up to the Hilltop, and
        compare it with the coastline.
      - Carry the chart (|wget chart|n, in the chart house aboard), and on the Hilltop, type
        |wlook coastline|n.

  - id: position
    ship: [anchorage]
    missing: [C5]
    hints:
      - And where exactly is this island? The chart's numbers are about to be tested.
      - Measure the island's position with the sextant, then the chronometer.
      - Aboard, |wuse sextant|n, then |wread chronometer|n.

  # --- The report -------------------------------------------------------------------------

  - id: report_wreck
    unanswered: wreck
    hints:
      - The journal may already say what happened to the Halcyon, and where.
      - Report what happened to the Halcyon. The wreck on the reef is your proof.
      - Type |wreport 1|n, and pick the answer the wreck on the reef proves.

  - id: report_why
    unanswered: why
    hints:
      - Why did nobody ever find the Halcyon? The journal holds the answer.
      - Report why nobody found her. Think of the empty sea at the chart's position, and
        which of the chart's numbers was wrong.
      - Type |wreport 2|n, and pick the answer the journal proves.

  - id: report_crew
    unanswered: crew
    hints:
      - What became of the Halcyon's crew? Think of what you heard and saw on the island.
      - Report what became of the crew. The people of the island, and what the crew left
        behind, are your proof.
      - Type |wreport 3|n, and pick the answer the journal proves.

  - id: anything
    hints:
      - Read the task at the top of the journal, and think about what is still missing.
      - Type journal to see the task and the clues, and think to see the questions they
        raise.
      - "|wjournal|n"
