# The places of Phantom Island: the Limbo prologue, the port and the island.
# The ship's Deck and where she can sail are in ship.yaml; the map pictures in maps.yaml.
#
# After editing (DECISIONS.md, 36 for removed places):
#   `batchcode build`, as a builder, for a place's `name`, `desc`, `exits`, `map`, `map_pos`
#     or `image`, and for adding or removing a place: the builder copies these into the
#     game's rooms. Rooms are updated in place, so players in them stay where they are.
#   `reload` is enough for everything in `details`: it is read from this file during play.
#
# Each place has:
#   name     the room's name, shown to players (and on the map)
#   map      which map it is on (a key from maps.yaml), and
#   map_pos  where on that map picture, as [x, y] pixels from the top left
#   image    optional: a picture for the Focus pane (/static/...). Without one, the pane shows
#            a placeholder card with the place's name.
#   desc     what players read when they look
#   exits    direction: place id. Compass directions, up, down, in and out get their short
#            forms (n, se, u...) automatically. For other aliases: `name: {to: id, aliases: [..]}`.
#   details  optional: parts of the place that aren't objects, seen with `look <detail>`
#            (`look beams`). Mark the word to look at in `desc` |wlike this|n.
#   hidden_until  optional: clue ids or flags. Paths are learned (DECISIONS.md, 40): until
#            all of them hold, the place isn't on the map, and the exits that lead to it are
#            neither shown nor usable. When they hold, everyone is told of the new path.
#   sets     optional: a flag set when someone arrives here (the Hilltop's view of the
#            village smoke opens the path to the Village)
#
# Each detail has (things in things.yaml have the same looking fields):
#   aliases  other words for it
#   desc     what `look <detail>` shows. With a `clue`, the fact itself is marked
#            [[like this]] and shown in yellow (DECISIONS.md, 20).
#   clue     optional: the clue (see clues.yaml) that `desc` reveals
#   close    optional: what `examine <detail>` shows, a closer look: {text, clue}
#   with     optional: more to see when the looker carries a thing from things.yaml (a
#            book, the chart): {thing id: {text, clue}}
#
# SPOILERS below: details reveal clues. Don't show this file to the players.
#
# Placeholder texts: short on purpose. Better writing comes in stage A5.

limbo:
  name: Phantom Island
  desc: >
    It is 1790. Fifteen years ago a sailing ship, the Halcyon, left port to chart a small
    island far out in the ocean, and never came back. Most people say she sank in a storm. But last month a
    trader in the port began selling a brass compass with one word engraved on it: HALCYON.


    Type |wbegin|n to start, or read on first. Stuck at any time? Type |whint|n.


    Now the Society sends an expedition, and you lead it, as captain of its ship. She carries the tools of two sciences: the navigator's
    sextant, clock and charts, which read the sun, the stars and the sea, and the naturalist's
    books, which read plants, animals, birds and the land. Your job: find out what really
    happened to the Halcyon and her crew. The expedition's |wjournal|n keeps the task and
    everything you find.


    Look carefully, and trust nothing until it fits: in this story, every detail has a
    reason.


    When you know what happened, and can prove it, send your |wreport|n to the Society. You
    can try it at any time.
  exits:
    begin: {to: office, aliases: [start]}

# --- The port ---------------------------------------------------------------------------

office:
  name: Society Office
  map: port
  map_pos: [300, 230]
  desc: >
    A quiet room above the street, lined with bookshelves and rolled-up charts. A large
    desk stands by the window, which looks down over the harbour.
  exits:
    southeast: quay
    east: market
  details:
    window:
      aliases: [harbour, harbor, view]
      desc: >
        Below the window the harbour is busy: fishing boats coming in, a merchant ship
        unloading, gulls over the water. At the end of the quay lies a ship with her sails
        furled: the Good Hope, waiting for you.
    bookshelves:
      aliases: [bookshelf, shelves, shelf, books]
      desc: >
        Rows of logbooks and journals from every voyage the Society could get hold of, each
        with a year on its spine. Someone has checked them all: the margins are full of
        small notes in red ink.
    charts:
      aliases: [chart, rolled-up charts, rolls]
      desc: >
        Charts of coasts and seas, rolled up and tied with ribbon. Far out in the oceans many
        of them are still blank, where nobody has looked yet. The Halcyon's chart isn't
        among them: its fair copy is in your ship's chart house.
    desk:
      aliases: [papers, pile, inkpot, ink]
      desc: >
        A wide desk covered in letters, lists and accounts, in neat piles that Mrs.
        Fairweather keeps straightening. An inkpot, a quill, and a little brass bell.
    street:
      aliases: [road, carts]
      desc: >
        From up here you hear carts rattling over the cobbles, and the shouting from the
        market next door.

market:
  name: Market
  map: port
  map_pos: [700, 230]
  desc: >
    Stalls crowd the square: fish, rope, spices, lamps and odd things from far away.
    Traders call out their prices over the noise. One |wstall|n draws a small crowd.
  exits:
    west: office
    southwest: quay
  details:
    goods:
      aliases: [fish, rope, spices, lamps, odd things, things]
      desc: >
        Silver fish on wet boards, coils of rope, sacks of pepper and cinnamon, brass lamps,
        and odd things that ships bring home from far away: a carved paddle, a shell as big
        as your head, a feather cloak nobody can explain.
    traders:
      aliases: [trader, prices, noise, square]
      desc: >
        Everyone here is selling something, and saying so as loudly as they can. "Fresh
        today!" "Cheapest in the port!" "Straight off the ship!"
    stall:
      aliases: [stalls, crowd, table]
      desc: >
        Silas Crane's stall: pots, cloth, knives, and right in the middle, where everyone
        can see it, a brass |wcompass|n. People keep pointing at it and whispering.

quay:
  name: Quay
  map: port
  map_pos: [500, 450]
  desc: >
    A long stone quay where ships load and unload. Barrels and coils of rope are stacked
    along the edge, and gulls argue over scraps of fish. On one of the coils sits an old
    sailor with a white beard, watching the harbour as if he still had a ship out there.
  exits:
    northwest: office
    northeast: market
  details:
    barrels:
      aliases: [barrel, stores, supplies]
      desc: >
        Barrels of salt beef, ship's biscuit and fresh water, waiting to be carried aboard.
        Some have GOOD HOPE chalked on the lid.
    rope:
      aliases: [ropes, coils, coil]
      desc: >
        Thick hemp rope, coiled neatly in big rings and smelling of tar. Old Barnaby sits on
        one of them as if it were his own armchair.
    gulls:
      aliases: [gull, scraps, birds]
      desc: >
        Grey and white gulls, loud and greedy, squabbling over fish heads. Gulls keep close
        to the coast: sailors say that far out on the open ocean you won't see one.
    harbour:
      aliases: [harbor, water, ships, boats]
      desc: >
        Ships at anchor, fishing boats coming and going, and beyond the harbour mouth the
        open ocean, stretching away to the west.

# --- The island -------------------------------------------------------------------------

beach:
  name: Lagoon Beach
  map: island
  map_pos: [780, 390]
  desc: >
    A curve of white sand around a calm green lagoon. Palm trees lean over the water, and
    behind them the forest begins: a narrow path climbs into it, to the northwest. A few
    |wgoats|n are nibbling at the bushes above the beach.
  exits:
    northwest: forest
    west: village
  details:
    lagoon:
      aliases: [water, sand, beach]
      desc: >
        Warm, clear water over white sand, so still that you can see small fish over the
        bottom. Out in the lagoon your ship rides at anchor.
    palms:
      aliases: [palm, palm trees, palm tree]
      desc: >
        Tall, bending trunks with a crown of long leaves at the top, and a few coconuts
        hanging under them. Nothing like the trees at home.
    path:
      aliases: [forest, narrow path]
      desc: >
        A narrow path climbs from the sand into the forest, to the northwest. Somebody walks
        here often: it is trodden smooth.
    goats:
      aliases: [goat, bushes]
      desc: >
        Three brown goats with clever yellow eyes. One is chewing a palm leaf and watches
        you while it chews. Nobody seems to look after them. How did goats get to an island
        so far out? The animal guide in the ship's chart house might know.
      with:
        animal_guide:
          teaches: {island_animals: used}
          clue: C9
          text: >
            You look them up in the animal guide. Goats never reach islands like this on
            their own: [[sailors bring goats on their ships, and leave them where they
            stay]].

village:
  name: Village
  hidden_until: [village_seen]  # its smoke, seen from the Hilltop
  map: island
  map_pos: [520, 410]
  desc: >
    A cluster of huts with roofs of woven leaves stands around an open space of beaten
    earth. Smoke rises from a cooking fire. One hut is bigger than the others, held up by
    dark, heavy |wbeams|n.
  exits:
    east: beach
    west: reef
    north: forest
    southwest: cove
  details:
    huts:
      aliases: [roofs, roof, leaves, earth, open space]
      desc: >
        Small round huts of light poles, with roofs of woven palm leaves that hang down
        almost to the ground. The open space between them is swept clean.
    fire:
      aliases: [smoke, cooking fire]
      desc: >
        A low fire in a ring of stones, with something wrapped in leaves cooking in the
        ashes. It smells wonderful.
    beams:
      aliases: [beam, timbers, timber, hut, big hut, wood]
      desc: >
        The big hut stands on thick, dark beams, much heavier than the light wood of the
        other huts. They look very old. Maybe worth a closer look (|wexamine beams|n).
      close:
        clue: C8
        text: >
          You run your hand over a beam. It's hard and close-grained, and an old iron nail
          is rusted into it, bent over flat. Square holes run along one side, where pegs
          once went: [[these beams were cut by shipwrights, long before they held up a
          hut]].
      with:
        plant_guide:
          teaches: {oak: used}
          clue: C8
          text: >
            You compare the beams with the plant guide. Heavy, dark and hard: [[this is
            oak, and no oak grows anywhere near here]]. Ships are built of oak.

reef:
  name: Western Reef
  hidden_until: [respect_tui]  # Tui shows the way, once you have listened to her song
  map: island
  map_pos: [170, 390]
  desc: >
    The western shore ends in a long coral reef. Waves break white over its outer edge,
    and the water in between is shallow and very clear. Out in the shallows, huge dark
    shapes stand up from the coral like |wbones|n.
  exits:
    east: village
    southeast: cove
  details:
    coral:
      aliases: [reef, waves, edge, water, shallows]
      desc: >
        The water over the reef is shallow and very clear, and the coral in it is every
        colour: pink, yellow, purple, branching like little trees. Further out, the waves
        break white over the reef's edge.
    bones:
      # Time is told, not kept (DECISIONS.md, 38): the wait for low tide is part of the look.
      teaches: {coral: used, tides: used}
      aliases: [big bones, shapes, ribs, wreck, cannon]
      clue: C7
      desc: >
        You wait on the shore until the tide goes out and the reef stands clear of the
        water. Then you wade out carefully over the coral. The bones are curved timbers, black with age
        and furred with weed, standing up in two rows. Between them lies a long lump of
        coral with a round mouth at one end: [[a ship's ribs, and a cannon, grown over with
        coral where she struck the reef]].

forest:
  name: Forest Path
  map: island
  map_pos: [520, 260]
  desc: >
    A narrow path climbs between tall |wtrees|n with broad leaves. Birds call somewhere
    above you, and the air is warm and damp.
  exits:
    south: village
    north: hilltop
    west: spring
    southeast: beach
  details:
    birds:
      aliases: [bird, calls]
      desc: >
        You hear them all around, whistling and chattering, but they stay hidden in the
        leaves high above you.
    trees:
      aliases: [tree, leaves, fruit]
      desc: >
        Tall smooth trunks, broad shiny leaves, and big green fruit hanging high up. The
        plant guide in the ship's chart house would name them.
      with:
        plant_guide:
          teaches: {oak: used}
          text: >
            The plant guide names them: breadfruit, pandanus and coconut palms, the trees
            of warm islands. Nothing like the oaks of home.

spring:
  name: Spring
  map: island
  map_pos: [320, 220]
  desc: >
    Clear water bubbles up between mossy rocks and runs off in a little stream. It is cool
    and quiet here. Beside the stream grows a patch of green |wshoots|n, in neat rows.
  exits:
    east: forest
  details:
    water:
      aliases: [spring, stream, rocks, moss]
      desc: >
        You cup your hands and drink. The water is cold and sweet, far better than anything
        from a ship's cask.
    shoots:
      aliases: [shoot, patch, rows, garden]
      desc: >
        Thin green shoots, planted in straight rows like a garden at home. You pull one up:
        a small white bulb, with a sharp smell that makes your eyes water. Somebody planted
        these. The plant guide in the ship's chart house might name the plant.
      with:
        plant_guide:
          teaches: {onions: used}
          clue: C9
          text: >
            The plant guide has a drawing of exactly this: [[onions, which sailors carry on
            ships and plant wherever they stay a while]].

hilltop:
  name: Hilltop
  sets: village_seen  # the smoke: the path to the Village opens (DECISIONS.md, 40)
  map: island
  map_pos: [560, 110]
  desc: >
    From the top of the hill you can see the whole island: the lagoon in the east, the
    reef in the west, and the open ocean all around. The |wcoastline|n is spread out below
    you like a map. South of the forest, thin smoke rises from a clearing among the trees:
    huts, and cooking fires. People live here.
  exits:
    south: forest
  details:
    smoke:
      aliases: [clearing, huts, fires, cooking fires, people]
      desc: >
        Thin smoke rising from a clearing south of the forest. You can make out the roofs of
        huts. The forest path should lead down that way.
    ocean:
      aliases: [sea, open ocean, lagoon]
      desc: >
        Open ocean all round, empty to the horizon. Inside the reef, the lagoon is pale green,
        and your ship lies in it, very small from up here.
    reef:
      aliases: [western reef, surf]
      desc: >
        A long line of white surf down the west side of the island, where the waves break on
        the reef. Thick forest lies between it and you: from up here, you can't see a way
        down to it.
    coastline:
      aliases: [coast, shape, view, shore]
      desc: >
        Round in the east, with the lagoon. A long reef down the west side. A little cove in
        the south, curled like a hook. You feel you've seen this shape before, drawn on
        paper. On a chart, perhaps? With the Halcyon's chart in your hands, you could compare.
      with:
        chart:
          clue: C10
          text: >
            You unroll the Halcyon's chart and hold it up against the view. The lagoon, the
            reef, the hook of the cove: [[it is the same island, line for line]].

cove:
  name: Boat Cove
  hidden_until: [cove_told]  # Elder Ama tells you where the one who stayed lives
  map: island
  map_pos: [330, 570]
  desc: >
    A small sheltered cove, hidden from the open sea by two arms of rock. The sand slopes
    gently down to the water, past an old |wslipway|n of logs.
  exits:
    northeast: village
    northwest: reef
  details:
    rocks:
      aliases: [rock, arms, sand, water]
      desc: >
        Two long arms of dark rock almost close the cove off from the sea. Inside them the
        water is calm: a good place to build a boat, and to launch it.
    slipway:
      aliases: [logs, chips, wood chips]
      desc: >
        A row of smooth logs laid down to the water, for rolling boats in and out. Old wood
        chips lie half buried in the sand all around. Someone has built more than canoes
        here.
