# The things of Phantom Island: objects players can look at, read, use and sometimes carry.
#
# SPOILERS: some of these reveal clues. Don't show this file to the players.
#
# Expertise lives in things, not in roles (DECISIONS.md, 6a): the instruments measure, and
# the books tell you what you're looking at, for whoever carries or uses them. A detail of a
# place can show more to someone carrying a book (`with:` in places.yaml).
#
# After editing:
#   `batchcode build`, as a builder, for a thing's `name`, `aliases`, `where`, `portable` or
#     `stays`, and for adding or removing a thing: the builder copies these into the game.
#   `reload` is enough for its texts (`desc`, `close`, `with`, `read`, `use`): they are read
#     from this file during play. Building again never takes a thing out of
# a player's hands: it is put back in its place only if it's lying somewhere else.
# Things a player carries go back to their place when that player leaves the game, so
# nobody can walk off with a book the others need.
#
# Each thing has:
#   name      shown to players (`You see: a sextant`)
#   aliases   other words for it (`get guide`, `read plants`)
#   where     the place id it starts in
#   portable  true if players can pick it up (default false)
#   stays     optional: what a player reads when they try to pick up a thing that isn't
#             portable
#   desc      what `look <thing>` shows. Like every text that reveals something, it can
#             have a `clue` (see clues.yaml) with the fact itself marked [[like this]].
#   clue      optional: the clue `desc` reveals
#   close     optional: what `examine <thing>` shows (a closer look): {text, clue}
#   with      optional: more to see when the looker carries another thing:
#             {thing id: {text, clue}}
#   image     optional: URL of its picture, shown in the Focus pane when someone looks at it
#             (without one, a card with its name)
#   read      optional: what `read <thing>` does (see "Actions" below)
#   use       optional: what `use <thing>` does
#
# Actions (read, use) have:
#   text       what happens, shown to everyone in the room. It can have a `clue`.
#   clue       optional
#   only_in    optional: the place id where it works (the sextant needs the Deck), and
#   elsewhere  what players read anywhere else
#   at         optional, aboard only: what happens instead at a ship position
#              (see ship.yaml). Each one has `text` and optional `clue`, plus:
#     sets       a flag to remember for the whole expedition (`sight_charted`)
#     needs      flags or clue ids that must already be found, and
#     otherwise  what happens until they are
#
# Flags are remembered by the expedition: the noon sight sets one, and reading the
# chronometer needs it, whoever does each step and whenever (DECISIONS.md, 36).

things:
  # --- In the port ------------------------------------------------------------------------

  compass:
    name: brass compass
    aliases: [compass, halcyon compass]
    where: market
    image: /static/phantom_island/pictures/compass.svg
    stays: >
      Crane's hand comes down on the compass. "Looking is free, friend. Taking isn't."
    desc: >
      A heavy brass compass in pride of place on Crane's stall. Its needle still swings
      north. On the lid, one word is engraved: [[HALCYON]]. It might be worth a closer look
      (|wexamine compass|n).
    clue: C1
    close:
      text: >
        You turn the compass over in your hands. The hinge of the lid is crusted with
        something hard, pale and rough. Not sand, not rust: [[coral, grown right into the
        brass]]. Coral only grows under the sea.
      clue: C2
      teaches: {coral: heard}

  # --- Aboard -------------------------------------------------------------------------------

  sextant:
    name: sextant
    aliases: [the sextant]
    where: deck
    image: /static/phantom_island/pictures/sextant.svg
    stays: >
      The sextant lives in its box in the chart house, and it's used right here on deck,
      where the sun and the horizon are. There's nothing to measure with it ashore.
    desc: >
      A brass instrument shaped like a slice of pie, with a small telescope, mirrors and a
      curved scale, kept in its box in the chart house. Navigators |wuse|n it at noon to
      measure how high the sun stands above the horizon. Ask the Good Hope about the
      |wsextant|n
      to learn more.
    use:
      teaches: {latitude: used}
      only_in: deck
      elsewhere: >
        You need the sun and a clear sea horizon for that: it's done on the ship's Deck.
      text: >
        You wait for noon, when the sun stands highest, and measure it. Latitude 14 degrees
        South: the harbour's own latitude, as every chart of it says. Noon here is noon at
        home, of course. This is home.
      at:
        under_way:
          teaches: {latitude: used}
          text: >
            You wait for noon, when the sun stands highest, and measure it. Latitude 14
            degrees South, the same as home: the ship is holding her latitude, as ordered.
        charted:
          teaches: {latitude: used}
          sets: sight_charted
          clue: C4
          text: >
            You wait for noon, when the sun stands highest, and measure it. [[Latitude 14
            degrees South: exactly the latitude written beside the island on the Halcyon's
            chart.]] Now the longitude: |wread chronometer|n to see the time of noon at
            home.
        north_of_chart:
          teaches: {latitude: used}
          sets: sight_north
          text: >
            You wait for noon, when the sun stands highest, and measure it. Latitude 12
            degrees South. The chart's latitude is 14: the ship has sailed off the island's
            line of latitude.
        south_of_chart:
          teaches: {latitude: used}
          sets: sight_south
          text: >
            You wait for noon, when the sun stands highest, and measure it. Latitude 16
            degrees South. The chart's latitude is 14: the ship has sailed off the island's
            line of latitude.
        east_of_chart:
          teaches: {latitude: used}
          sets: sight_east
          text: >
            You wait for noon, when the sun stands highest, and measure it. Latitude 14
            degrees South: still the latitude on the Halcyon's chart. The |wchronometer|n
            will tell how far east you have come.
        anchorage:
          teaches: {latitude: used}
          sets: sight_island
          text: >
            You wait for noon, when the sun stands highest, and measure it. Latitude 14
            degrees South: the island's latitude on the Halcyon's chart, to the minute.
            Now |wread chronometer|n for the longitude.

  chronometer:
    name: chronometer
    aliases: [clock, sea clock, brass clock]
    where: deck
    image: /static/phantom_island/pictures/chronometer.svg
    stays: >
      The chronometer is screwed into its box, and the box is screwed to the ship. It
      stays where it is. (And it really should: moving it would spoil its timekeeping.)
    desc: >
      A fat brass clock in a wooden box, fixed beside the chart table in the chart house.
      It keeps the time
      of the home port, all voyage long. You can |wread|n it.
    read:
      text: >
        The chronometer ticks steadily. It shows the time at home, which here in port is
        simply the time.
      at:
        under_way:
          teaches: {longitude: understood}
          text: >
            The chronometer ticks steadily, keeping home time. Out here the sun reaches
            its noon later than it does at home, and the further west the ship sails, the
            later it gets.
        charted:
          teaches: {longitude: used}
          needs: [sight_charted]
          clue: C4
          text: >
            Noon came when the chronometer showed twenty to three in the afternoon,
            home time: 160 minutes after noon at home. Four minutes for every degree makes
            [[40 degrees West: the longitude on the Halcyon's chart. Both of the chart's
            numbers check out. You are exactly where the chart puts the island, and there is
            no island.]] So one of the chart's two numbers must be wrong. Which one would
            you trust?
            The Good Hope knows how each is measured: |wask hope about latitude|n, |wask hope
            about longitude|n.
          otherwise: &no_sight >
            The chronometer ticks steadily, keeping home time. On its own it can't say
            where you are: you also need the moment of noon out here. Measure the noon sun
            first: |wuse sextant|n.
        north_of_chart:
          teaches: {longitude: used}
          needs: [sight_north]
          text: >
            Noon came at twenty to three, home time, the same as at the chart's
            position: still 40 degrees West. Sailing north changed the latitude, not the
            longitude.
          otherwise: *no_sight
        south_of_chart:
          teaches: {longitude: used}
          needs: [sight_south]
          text: >
            Noon came at twenty to three, home time, the same as at the chart's
            position: still 40 degrees West. Sailing south changed the latitude, not the
            longitude.
          otherwise: *no_sight
        east_of_chart:
          teaches: {longitude: used}
          needs: [sight_east]
          text: >
            Noon came at twenty-eight minutes to three, home time: 152 minutes after
            noon at home, so 38 degrees West. Two degrees back towards home, on waters the
            ship already crossed on the way out.
          otherwise: *no_sight
        anchorage:
          teaches: {longitude: used}
          needs: [sight_island]
          clue: C5
          text: >
            Noon came when the chronometer showed sixteen minutes to three, home
            time: 164 minutes after noon at home. Four minutes for every degree makes 41
            degrees West. [[The island lies at exactly the chart's latitude, but 1 degree
            further west than the chart's longitude.]] Only four minutes on the clock, and
            a hundred kilometres of sea.
          otherwise: *no_sight

  chart:
    name: Halcyon's chart
    aliases: [chart, old chart, the chart, map, halcyon chart]
    where: deck
    image: /static/phantom_island/pictures/chart.svg
    portable: true
    desc: >
      A fair copy of the Halcyon's chart, lent by the Society. It shows an island drawn in
      careful ink, with its position written beside it. You can |wread|n it, or
      |wexamine|n it for a closer look, and |wget|n it to take it with you.
    close:
      teaches: {positions: understood, dead_reckoning: heard}
      text: >
        You spread the chart out flat. The coast of home runs down its right-hand edge. Thin
        ruled lines cross the paper: the ones from side to side are lines of latitude, and
        one of them runs straight from our harbour to the island. So the island lies
        exactly as far south as home, only far to the west. Beside the island, in small
        writing: "Position fixed by our |wreckoning|n." (What is that? |wask hope about reckoning|n.)
    read:
      teaches: {positions: heard}
      sets: chart_read  # the port council's first step needs the chart's position read
      text: >
        In the master's careful hand: "Island, found by the Halcyon, 1775."|/Beside it, in
        large figures: Latitude 14 degrees South, longitude 40 degrees West of
        home.|/The
        coastline is
        drawn with care: round in the east with a lagoon, a hill in the middle, a long reef
        down the west side, and a little cove in the south, like a hook.|/To sail there, give the crew the order: |wsail to 14 south 40 west|n.
      at:
        # At the island, no order to sail away (playtest 2026-11-25: it led back to sea).
        anchorage:
          text: >
            In the master's careful hand: "Island, found by the Halcyon, 1775."|/Beside it, in
            large figures: Latitude 14 degrees South, longitude 40 degrees West of
            home.|/The coastline is drawn with care: round in the east with a lagoon, a hill in
            the middle, a long reef down the west side, and a little cove in the south, like a
            hook.

  plant_guide:
    name: plant guide
    aliases: [guide to plants, plants, plant book, botany]
    where: deck
    image: /static/phantom_island/pictures/plant_guide.svg
    portable: true
    desc: >
      "A Naturalist's Guide to Useful Plants", a thick book full of careful drawings. Carry
      it, and you'll know more about the plants you look at: |wget|n it to take it
      with you. You can also |wread|n it.
    read:
      teaches: {oak: understood, onions: understood}
      text: >
        You leaf through it. Breadfruit, coconut and pandanus grow on warm islands. Oak is
        heavy, dark and hard, and grows only in cool lands far from here: ships are built
        of it. Onions keep for months, so ships carry them, and sailors plant them wherever
        they stay a while.

  animal_guide:
    name: animal guide
    aliases: [guide to animals, animals, animal book, zoology]
    where: deck
    image: /static/phantom_island/pictures/animal_guide.svg
    portable: true
    desc: >
      "A Naturalist's Guide to Animals", with drawings of beasts, birds and fish. Carry it,
      and you'll know more about the animals you look at: |wget|n it to take it
      with you. You can also |wread|n it.
    read:
      teaches: {island_animals: understood, coral: understood}
      text: >
        You leaf through it. Few land animals ever reach islands far out in the ocean on
        their own: birds fly there, lizards drift on logs. Goats never do. Sailors carry
        goats on ships for milk and meat, and sometimes leave a few ashore. Coral is built
        by
        tiny sea animals, in warm, clear, shallow water; over the years it grows into reefs,
        and over anything that lies on them.
