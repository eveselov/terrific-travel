# The ideas of Phantom Island: what goes into each player's notebook (DECISIONS.md, 27).
#
# The journal holds facts about this mystery, shared by the expedition. The notebook holds
# ideas about how the world works (latitude, why coral grows only under the sea), and each
# player has their own. A notebook entry states the idea, never what it means for the
# mystery: "coral grows only under the sea" is an idea; "so the compass lay in the sea" is a
# clue's journal line; "so she wrecked on a reef" is the players' own conclusion.
#
# An idea has up to three texts, one per level, written so that they read as one paragraph:
#   heard       a first mention (Barnaby says the noon sun gives north and south)
#   understood  explained properly (the Ship's latitude, step by step)
#   used        done yourself (a noon sight with the sextant)
# The entry shows the texts up to the level reached, so it grows as the player learns more.
# Not every idea needs every level; most will never be "used".
#
# A text teaches ideas with `teaches`, next to where `clue` would go, in characters.yaml
# (a topic or its truth), things.yaml (a thing, its close look, a read or use, or one of
# its `at` steps) and the details in places.yaml and ship.yaml:
#   teaches: {latitude: understood}
# Conversations and reading or using a thing teach everyone in the room who hears them, up
# to `understood`; `used` is for whoever did it. Looking is private and teaches the looker.
#
# Each area has:
#   title    shown as the heading in the notebook
# Each idea has:
#   area     the area it belongs to
#   title    its name in the notebook (Latitude)
#   heard, understood, used   its texts, at least one
#   learn    optional: where to learn it, shown by `think` to players who don't have it
#            yet. Needed for every idea a connection (clues.yaml) lists in `ideas`.
#
# A title names the idea in general, how the world works ("How winds are named"), never
# what was found ("Birds flying west at dusk" is a clue's title, in the journal).
#
# The notebook shows only areas the player has started, with how many of their ideas they
# know ("Navigation: 2 of 9"). Keep it small: ideas the game actually uses, not an
# encyclopedia.
#
# After editing, `reload` in the game is enough.

# The ideas are listed here in the order the notebook shows them. Where each one is taught
# is noted above it: H heard, U understood, D used (done or seen yourself).

areas:
  navigation:
    title: Navigation
  sea_and_sky:
    title: Sea and sky
  nature:
    title: Nature
  people:
    title: People and the past

ideas:
  # --- Navigation ---------------------------------------------------------------------------

  # H Barnaby's sailing · U the Ship's latitude, sextant · D the sextant used
  latitude:
    area: navigation
    title: Latitude
    heard: >
      How far north or south you are. The noon sun tells it.
    understood: >
      The higher the sun stands at noon, the nearer you are to the equator. Measure its
      height with a sextant, look it up in the tables, and you have your latitude. Sailors
      have measured it well for centuries.
    used: >
      You have taken a noon sight yourself, on deck.

  # H Barnaby's sailing · U the Ship's longitude · D the chronometer after a noon sight
  longitude:
    area: navigation
    title: Longitude
    learn: "|wask ship about longitude|n"
    heard: >
      How far east or west you are. Old sailors could only guess it.
    understood: >
      The Earth turns a full circle in a day, 15 degrees every hour. So noon comes 4
      minutes later for every degree you go west. Compare the moment of noon where you are
      with the time at home, and the difference gives your longitude.
    used: >
      You have worked out a longitude yourself, from a noon sight and the chronometer.

  # H Barnaby's sailing, Jonah's chart · U the Ship's chronometer
  sea_clocks:
    area: navigation
    title: Sea clocks
    learn: "|wask ship about chronometer|n"
    heard: >
      Some ships now carry a clock that keeps the time of home all voyage long. Not every
      old sailor trusts one.
    understood: >
      A sea clock, or chronometer, must keep time to a few seconds for months on end,
      through heat, cold and rolling seas. Mr Harrison proved it could be done, but such
      clocks are new and costly, and few ships carry one.

  # H Barnaby's sailing, Jonah's chart, the chart examined · U the Ship's reckoning
  dead_reckoning:
    area: navigation
    title: Dead reckoning
    learn: "|wask ship about reckoning|n"
    heard: >
      Working out where you are from your heading, your speed and how long you have
      sailed.
    understood: >
      North and south, the noon sun checks your reckoning every day. East and west, nothing
      can check it without a sea clock, so small errors add up, day after day.

  # H the chart read · U the Ship's course, the chart examined · D an order to sail
  positions:
    area: navigation
    title: Positions and charts
    heard: >
      A place at sea is written as two numbers: its latitude and its longitude.
    understood: >
      On a chart, the lines from side to side are lines of latitude, and the lines from top
      to bottom are lines of longitude. Two places on the same line from side to side lie
      exactly as far north or south as each other.
    used: >
      You have given the ship an order to sail to a position.

  # H the Ship's chart · U the order to sail out of port · D sailing on from the chart's position
  latitude_sailing:
    area: navigation
    title: Sailing along a latitude
    heard: >
      If you trust your latitude but not your longitude, sail along the latitude until you
      find land.
    understood: >
      Measure your latitude by the noon sun every day and keep it the same: then you sail
      due east or due west along one line, and sooner or later anything on that line comes
      into sight.
    used: >
      You have sailed along a latitude yourself, searching for land.

  # --- Sea and sky --------------------------------------------------------------------------

  # U the Ship's birds · D the sky at dusk, at the chart's position
  seabirds:
    area: sea_and_sky
    title: How seabirds show land
    learn: "|wask ship about birds|n"
    understood: >
      White terns and noddies fish at sea all day and fly home to land to sleep: white terns
      from as far as a hundred miles out, noddies from nearer. At dusk, the way they fly
      shows where land is. Island navigators have used them for a very long time.
    used: >
      You have watched the seabirds leave at dusk yourself.

  # H Ama's reef · U the Ship's tide
  tides:
    area: sea_and_sky
    title: Tides
    heard: >
      A reef can be walked only at low tide.
    understood: >
      The sea rises and falls about twice a day, a little later each day. At low tide a
      reef can stand clear of the water; at high tide it is hidden, and dangerous.

  # H Barnaby's storm · U the Ship's wind
  winds:
    area: sea_and_sky
    title: How winds are named
    heard: >
      A wind is named for where it comes from: a west wind blows from the west.
    understood: >
      So a west wind blows towards the east, and pushes anything afloat eastwards; an east
      wind, like the trade wind out here, pushes it west. Mix up a wind's name and its
      direction, and you look for whatever it carried on the wrong side.

  # U the Ship's horizon
  horizon:
    area: sea_and_sky
    title: How far a lookout sees
    learn: "|wask ship about horizon|n"
    understood: >
      The Earth is round, so the sea curves away out of sight. From a masthead a lookout
      sees about 20 kilometres of open sea, and a hilly island perhaps 50 to 70 kilometres
      away. Anything further is hidden below the horizon, however clear the day.

  # U the Ship's water
  fresh_water:
    area: sea_and_sky
    title: Fresh water at sea
    understood: >
      Sea water can't be drunk. A ship carries fresh water in casks, the crew drink from them
      every day, and they must be filled again at a spring ashore.

  # --- Nature -------------------------------------------------------------------------------

  # H the compass examined · U the animal guide · D the reef, waded over
  coral:
    area: nature
    title: Coral
    learn: "|wread animal guide|n, in the chart house"
    heard: >
      Coral grows only under the sea.
    understood: >
      Coral is built by tiny sea animals, in warm, clear, shallow water. Over the years it
      grows into reefs, and over anything that lies on them: rocks, anchors, even ships.
    used: >
      You have waded out over a coral reef yourself.

  # H Fairweather's halcyon · U the plant guide · D wood or trees looked at with the plant guide
  oak:
    area: nature
    title: Oak and island trees
    learn: "|wread plant guide|n, in the chart house"
    heard: >
      Good ships are built of oak.
    understood: >
      Oak is heavy, dark and hard, and grows only in cool lands far from here. Warm islands
      grow breadfruit, pandanus and coconut palms instead.
    used: >
      You have told oak from island trees yourself, with the plant guide in your hands.

  # U the plant guide · D the shoots by the spring, with the plant guide
  onions:
    area: nature
    title: Onions on ships
    learn: "|wread plant guide|n, in the chart house"
    understood: >
      Onions keep for months, so ships carry them, and sailors plant them wherever they stay
      a while.
    used: >
      You have found onions growing, and known them with the plant guide.

  # U the animal guide · D the goats, with the animal guide
  island_animals:
    area: nature
    title: How animals reach islands
    learn: "|wread animal guide|n, in the chart house"
    understood: >
      Few land animals ever reach islands far out in the ocean on their own: birds fly
      there, and lizards drift there on logs. Goats never do. Sailors carry goats for milk
      and meat, and sometimes leave a few ashore.
    used: >
      You have checked animals against the animal guide yourself.

  # --- People and the past ------------------------------------------------------------------

  # H the Ship's help · U the Ship's witnesses
  witnesses:
    area: people
    title: Comparing witnesses
    learn: "|wask ship about witnesses|n"
    heard: >
      People don't always tell the truth, so compare what they say.
    understood: >
      Some people tell what they believe, and some tell what suits them. Ask several people
      about the same thing and compare. Where they agree, it is likely true; where they
      differ, look for something you can see for yourself.

  # H Tui's song · U Ama's song
  songs:
    area: people
    title: Songs that keep history
    learn: "|wask ama about song|n, in the Village"
    heard: >
      Some songs tell of things that really happened.
    understood: >
      People who don't write things down keep their history in songs, and teach them to
      the children. A song can be older than anyone living, and still tell what happened.
