# The characters of Phantom Island and what they say: `ask <character> about <topic>`.
#
# SPOILERS: this file holds the solution of the mystery. Don't show it to the players.
#
# `stance` isn't used by the game yet: it's a note for the writer, and for the AI characters
# of phase B, who need to know what each character may reveal.
#
# Topic words in replies are marked |wlike this|n (white), so players see what else to ask.
# A reply with a `clue` marks the fact itself [[like this]]: the game shows it in yellow and
# writes the clue into the journal (see clues.yaml). Only true clues are marked, never a
# mistaken or lying reply (DECISIONS.md, 20).
# A reply (or greeting, or fallback) that starts with a quote is shown as speech:
# `Old Barnaby says: "..."`. One that starts otherwise is narration, shown as written.
#
# After editing, `reload` in the game (or `uv run evennia reload`) is enough for new
# replies. Adding or removing characters, or changing names or `where`, also needs
# `batchcode build`.
#
# How to write replies (DECISIONS.md, 23)
#
# Richness comes from the plot, not the prose: more connections between the people, things
# and clues we already have, not more adjectives. Players act on what they read, so every
# noun is a promise; decoration they can't act on is a false lead.
#   - Short: about 30-60 words, two to four sentences; a greeting one or two. A longer
#     reply is a sign it should be split into a short answer and a new topic. Depth is one
#     question further down, behind a white word, never in one long reply.
#   - The answer first, then one concrete detail that does double duty: vivid *and* a fact
#     that fits the world ("built of good oak" prepares C8; "seas like hills"). A detail
#     that is only pretty gets cut.
#   - Most replies end with at least one white word leading somewhere new: no dead ends.
#   - Name the subject at its first mention in each reply ("the Halcyon", not "she"):
#     players read replies in any order.
#   - Figurative language only in a character's own voice, where it shows who they are
#     (Barnaby's sayings, Tui's song). Narration stays plain.
#   - Prefer connections: a reply that points to another character, thing or clue
#     (Barnaby on Crane's compass) is worth more than a new detail.
#   - Every fact is in "The truth" in GAME_STORY.md, or goes into its table of facts that
#     depend on each other (DECISIONS.md, 22).
#   - Voice matters more than length: each character's `voice` says how they speak.
#
# topic_aliases: words that mean the same topic whoever you ask. They apply to every
# character who has a topic with that id; a topic can add its own `aliases` too.
#
# Each character has:
#   name      shown to players
#   aliases   other words players can use for them (`ask barnaby`, `ask sailor`)
#   where     a place id from places.yaml, a list of them (the character will move
#             between them from A4; until then they stand in the first), or `aboard`
#             (the Deck and the Cabin)
#   desc      what players read when they look at them
#   voice     how they speak: a note for the writer, and for the AI characters of phase B
#   image     optional: URL of their picture, shown in the Focus pane when someone looks at
#             them (without one, a card with their name)
#   greeting  the reply to `ask <character>` with no topic; the `suggest` topics follow it
#   suggest   topics offered to players who don't know what to ask
#   fallback  the polite reply for any topic the character doesn't know
#   topics    topic id: what they say about it
#
# Each topic has:
#   reply     what the character says
#   aliases   optional: other words for this topic, for this character only
#   stance    truth (what they say is true), mistaken (they believe it, but it's wrong),
#             hiding (they know better and don't say)
#   clue      optional: the clue (C1..C13, see GAME_STORY.md) this reply reveals (A3)
#   truth     optional, for what a character hides: the reply given once `needs` holds
#     needs   clue ids already in the journal, or flags such as `respect` (set by things
#             players do; the flags come in A4)
#     reply   what they say then
#     clue    the clue that reply reveals

topic_aliases:
  halcyon: [the halcyon, ship halcyon, lost ship]
  compass: [brass compass, halcyon compass]
  island: [the island, phantom island]
  storm: [great storm, the storm, storm of 75]
  crew: [sailors, survivors, the crew]
  chart: [map, old chart, the chart]
  reef: [western reef, the reef]

characters:
  # --- The port -------------------------------------------------------------------------

  fairweather:
    name: Mrs. Fairweather
    aliases: [fairweather, patron, mrs fairweather]
    where: office
    voice: >
      Formal and precise, a little old-fashioned; full sentences, no slang. Kind but
      businesslike: she chooses her words like someone used to writing letters. Honest
      about how little she knows.
    desc: >
      The patron of the Society: a tall woman in a grey coat, with ink on her fingers and
      a pile of papers she keeps straightening.
    greeting: >
      "Ah, you've come: the newest members of the Society's expedition. Welcome aboard,
      or nearly. Sit down. There is a great deal to tell, and very little of it is
      certain."
    suggest: [mission, halcyon, chart, letter]
    fallback: >
      Mrs. Fairweather frowns politely. "I'm afraid that is outside my knowledge. The
      Society deals in charts and letters, not gossip."
    topics:
      mission:
        aliases: [expedition, job, task]
        stance: truth
        reply: >
          "The Society wants the truth about the |wHalcyon|n. Fifteen years of rumours, and
          now a |wcompass|n with her name on it turns up in our own market. Silas Crane has
          it on his stall, just east of here. Go and look at it first. Then take your
          |wship|n to the |wisland|n on her |wchart|n and see what is left to find."
      halcyon:
        stance: truth
        reply: >
          "The Halcyon sailed from this harbour in 1775 to chart a small |wisland|n far out
          in the ocean. A sound ship, built of good oak, with a careful master. Her last
          |wletter|n reached us, and then nothing. Not a plank, not a word. The families of
          her |wcrew|n still ask me for news."
      chart:
        stance: mistaken
        reply: >
          "The Halcyon's chart is the |wSociety|n's most precious paper, so the original stays
          locked away here. A fair copy is waiting for you in your ship's cabin. The island
          is drawn on it, with its latitude and longitude written beside it. Her master was
          a careful man; I have never had reason to doubt it."
      letter:
        aliases: [last letter]
        stance: truth
        reply: >
          Mrs. Fairweather takes a worn, much-folded letter from the top of her pile. "Her
          master's last letter, in his own hand. I know it by heart, but listen." She reads
          aloud: "'We have found the |wisland|n and fixed its position. Good water, fair
          weather, friendly people. We sail again soon.'" She folds it again. "That was the
          last word we ever had."
      island:
        stance: truth
        reply: >
          "A small island far out in the ocean, to the west. Sailors spoke of it for years,
          but nobody had put it on a chart. That was the Halcyon's task. Her |wchart|n is
          all we know of it; nobody from here has been there since."
      ship:
        aliases: [captain, command, orders]
        stance: truth
        reply: >
          "The Society has hired a sound ship and a good crew. Where she sails is for you to
          decide: you lead this expedition, and the crew will follow your orders. She lies
          at the quay, south-east of here."
      crew:
        stance: truth
        reply: >
          "Good seamen, most of them from this port. Their families still come to my door
          every spring, in case there is news of the |wHalcyon|n. That is why the Society
          never let the matter rest: someone owes them the truth."
      society:
        aliases: [the society]
        stance: truth
        reply: >
          "Our members collect charts, journals and specimens from every voyage they can.
          A map is only as good as the people who made it, so we like to check."

  barnaby:
    name: Old Barnaby
    aliases: [barnaby, sailor, old sailor]
    where: quay
    voice: >
      An old sailor's talk: short, salty sentences, sea sayings and rhymes, "mark my
      words", "aught". Sure of himself, kindly, fond of a story. Says what he believes,
      and believes the Halcyon sank.
    desc: >
      A retired sailor with a white beard and a pipe that has gone out, sitting on a coil
      of rope as if he owns the quay.
    greeting: >
      Barnaby squints at you. "You'll be one of the Society's lot, then, off after the
      Halcyon at last. Your ship's waiting at the end of the quay; step |waboard|n when
      you're ready. But sit down first, if you've a mind to. I've time, and stories."
    suggest: [expedition, halcyon, storm, weather, sailing]
    fallback: >
      Barnaby scratches his beard. "Can't say I know aught about that. Ask me about wind
      and water, though."
    topics:
      expedition:
        aliases: [ship, society, voyage]
        stance: truth
        reply: >
          "Whole port's talking of it. The Society's sending a ship to find the |wHalcyon|n,
          fifteen years on, and you're to sail in her. Sound ship, well found. She lies at
          the end of the quay: just step |waboard|n. Mind, I'd sooner you came back than
          found anything."
      halcyon:
        stance: mistaken
        reply: >
          "The Halcyon? I watched her sail out of this harbour in '75, sound as a bell. She
          went down in |wthe great storm|n that same season, all hands. I was at sea that
          year myself: no ship could have lived through it. Whatever that |wcompass|n of
          Crane's is, it came off the bottom."
      storm:
        stance: truth
        reply: >
          "Worst I ever saw. Three days of wind out of the west, and seas like hills. Out
          of the west, mind: a wind is named for where it comes from, so that one blew
          towards us. If the Halcyon was anywhere near that |wisland|n, she's on the
          bottom, mark my words."
      island:
        stance: truth
        reply: >
          "Never seen it myself. It's far out west, past where any sensible fisherman goes.
          Some of the old hands call it a phantom: here one voyage, gone the next."
      weather:
        aliases: [sky, wind]
        stance: truth
        reply: >
          "Red sky at night, sailor's delight. Red sky in the morning, sailor's warning.
          And mackerel sky and mares' tails make tall ships carry low sails. Learn those
          and you'll live long at sea."
      sailing:
        aliases: [navigation, dead reckoning]
        stance: truth
        reply: >
          "In my day we found our way with a compass, a log line and a good guess. Dead
          reckoning, it's called. North and south you could trust from the noon sun. East
          and west was guesswork. Your ship has one of those new sea clocks below, I hear.
          Never trusted 'em myself."
      compass:
        stance: mistaken
        reply: >
          "Crane's been waving that compass at everyone. Washed out of the wreck, I'd say,
          and up on some beach. Ask him where he got it, if you can get a straight answer."

  crane:
    name: Silas Crane
    aliases: [crane, silas, trader]
    where: market
    image: /static/phantom_island/pictures/crane.svg
    voice: >
      A salesman's patter: friendly, quick, too smooth, calls people "friend". Answers a
      question with a shrug or a sales pitch, and goes vague whenever it gets close to
      where the compass came from. Once caught out, grumbling and a little ashamed.
    desc: >
      A trader in a coat too warm for the weather, standing behind a stall of pots, cloth,
      knives and curiosities. His eyes follow your hands.
    greeting: >
      Crane spreads his arms over his stall. "Everything on this table is honestly come by.
      What can I do for you, friend?"
    suggest: [compass, trade, halcyon]
    fallback: >
      Crane shrugs. "Not my line of business, friend."
    topics:
      compass:
        stance: hiding
        reply: >
          "Found it on a |wbeach|n, I did, washed up after a |wstorm|n. A lucky find. Lucky
          for whoever buys it, too."
        truth:
          needs: [C2]
          clue: C3
          reply: >
            Crane looks at the coral in the hinge and sighs. "All right. I didn't find it.
            I traded for it with [[|wfishermen|n who sailed in from the west]], a long way out.
            I kept quiet because people would call me a wreck looter. I'm not. I paid fair."
      beach:
        stance: hiding
        reply: >
          "Which beach? Oh, one down the coast. Can't remember which. They all look the
          same, beaches. Ask old |wBarnaby|n on the quay, he's walked every one of them."
      storm:
        stance: hiding
        reply: >
          "Last winter's, the big blow just after the new year. Next morning, there it was
          on the sand, shining. Fresh out of the sea, you might say."
        truth:
          needs: [C2]
          reply: >
            Crane spreads his hands. "Storm? There's always a storm, in a port like this.
            It made a better story than 'bought it off strangers', that's all."
      fishermen:
        aliases: [fisherman, west]
        stance: hiding
        reply: >
          "Fishermen? I deal with all sorts, friend. Couldn't tell one from another."
        truth:
          needs: [C2]
          clue: C3
          reply: >
            "They came in a big canoe with an outrigger, [[from many days' sailing to the
            west]]. They didn't care for brass. They wanted iron nails, and they knew a good
            trade when they saw one."
      halcyon:
        stance: truth
        reply: >
          "The Halcyon? Never knew her. Before my time in this port. But a name like that on
          a |wcompass|n sells, I can tell you."
      trade:
        aliases: [stall, price, buy, sell]
        stance: truth
        reply: >
          "Pots, cloth, knives, a bit of everything. Everything's for sale at the right
          price. That |wcompass|n, now: that one's special."

  # --- The island -----------------------------------------------------------------------

  ama:
    name: Elder Ama
    aliases: [ama, elder]
    where: village
    voice: >
      Slow, calm and proverbial; few words, each one weighed. Speaks in images from the
      island's life (the lagoon, the reef, the generations). Courteous to strangers, and
      waits to see whether they are courteous too.
    desc: >
      An old woman sitting in the shade of a hut, weaving a fishing net with quick, sure
      fingers. Everyone who passes greets her first.
    greeting: >
      The elder looks at you for a long moment. "Strangers from the sea, again. Sit with
      me."
    suggest: [village, island, reef, halcyon]
    fallback: >
      Elder Ama keeps weaving. "That is not something I can tell you about."
    topics:
      village:
        aliases: [people, home]
        stance: truth
        reply: >
          "Our people have lived here for more generations than I can count on my fingers
          and toes. The lagoon gives us fish, the forest gives us wood, and the |wreef|n
          keeps the big waves away."
      island:
        stance: truth
        reply: >
          "It is small, but it has all we need. Water at the spring, gardens, the forest.
          Climb the hill and you will see all of it at once."
      reef:
        # A4 idea: asking about the reef before going there counts as respect.
        stance: truth
        reply: >
          "The western reef keeps old things. Go only at low tide, and walk carefully.
          It is good that you asked before going."
      halcyon:
        aliases: [ship, strangers, wreck]
        stance: hiding
        reply: >
          "Many things come from the sea. Some are fish, some are stories. Not every story
          is for the first day."
        truth:
          needs: [respect]
          clue: C12
          reply: >
            "Fifteen winters ago a great storm threw a ship onto the western reef. Our
            people paddled out into the storm and [[brought every one of them ashore,
            alive]]. They lived with us for a season and learned our songs. Then most of
            them went away again, over the sea to the west."
      tui:
        aliases: [child, grandchild]
        stance: truth
        reply: >
          "Tui is my grandchild. Tui talks to every stranger and keeps every shiny thing the
          sea gives back. Ask for the song: children remember what the old ones forget."
      crew:
        stance: hiding
        reply: >
          "Ask me again when we know each other better."
        truth:
          needs: [respect]
          clue: C12
          reply: >
            "[[They built a boat at the |wcove|n, with wood from their broken ship]] and rope
            from our trees. One of them stayed. He still lives among us."

  tui:
    name: Tui
    aliases: [child, kid]
    where: [village, reef]
    voice: >
      A child: excited, quick, jumps from one thing to the next. Short sentences,
      exclamations, funny little details (the goat ate her hat). Repeats what the grown-ups
      say, and sings.
    desc: >
      A child of about ten, barefoot, with a little bag on a string around the neck that
      clinks when Tui moves.
    greeting: >
      "Hello! Are you from a ship? Do you want to see my |wbuttons|n?"
    suggest: [buttons, bones, song]
    fallback: >
      Tui shrugs. "Don't know. Do you want to hear my |wsong|n instead?"
    topics:
      buttons:
        aliases: [bag, shiny]
        stance: truth
        reply: >
          Tui tips out a handful of brass buttons. "Shiny ones! I find them out by the
          |wbig bones|n, and Grandmother has old ones in her basket. Look, this one has a
          little anchor on it. Old |wJonah|n says it's off a sailor's coat."
      bones:
        aliases: [big bones, monster, reef]
        stance: truth
        reply: >
          "At low tide you can walk out to the big bones on the reef. They're huge, bigger
          than a whale! My cousin says a sea monster died there. I don't think so. Monsters
          don't have nails in them."
      song:
        stance: truth
        clue: C11
        reply: >
          Tui sings:

          "People came out of the sea,
           their big canoe broke on the reef.
           They [[made a new canoe with a white wing
           and flew away to where the sun goes to sleep]]."
      goats:
        aliases: [goat]
        stance: truth
        reply: >
          "The goats? They came with the sea people, Grandmother says. They eat
          everything! Even my hat, once."
      jonah:
        aliases: [pike, carpenter, cove]
        stance: truth
        reply: >
          "Old Jonah lives by the |wcove|n. He makes boats, and he talks funny, like you.
          He's nice. He made me a whistle."

  jonah:
    name: Jonah Pike
    aliases: [jonah, pike, carpenter]
    where: cove
    voice: >
      Plain and tired, a working man's English after fifteen years among islanders; short
      sentences, no fuss. Honest, a little sad, glad to tell it at last. A carpenter's eye
      for wood, boats and how things are made.
    desc: >
      A weathered man with grey hair tied back, shaping a plank with an adze. He dresses
      like the islanders, but his face is sunburnt the way only a sailor's gets.
    greeting: >
      He puts down his adze. "Well. I wondered if anyone would ever come looking."
    suggest: [halcyon, wreck, boat, crew]
    fallback: >
      Jonah rubs his chin. "Fifteen years here, and I've forgotten more about that than
      I ever knew."
    topics:
      halcyon:
        stance: truth
        clue: C13
        reply: >
          "[[I was the Halcyon's carpenter.]] Jonah Pike. We found this island, fixed its
          place on the |wchart|n, or thought we had, and anchored off the west side. Then
          the |wstorm|n came."
      wreck:
        aliases: [reef, storm, great storm, sinking]
        stance: truth
        clue: C13
        reply: >
          "Wind out of the west, and the anchors dragged. [[She struck the reef in the
          night.]] If the islanders hadn't come out in their canoes, we'd all have drowned.
          [[Not one of us was lost.]]"
      boat:
        aliases: [canoe, white wing]
        stance: truth
        clue: C13
        reply: >
          "[[We built her right here, from the Halcyon's own oak]], with rope from island
          fibre and a sail of patched canvas. A white wing, the children call it."
      crew:
        aliases: [west, the others]
        stance: truth
        clue: C13
        reply: >
          "[[Most of them sailed west in her]], to reach the trading routes. I never heard
          what became of them. I stayed. I'd married by then, and this was home."
      chart:
        aliases: [longitude, position]
        stance: truth
        reply: >
          "Our master swore by his longitude. But we had no sea clock, only dead reckoning
          and his moon tables, and we'd been months at sea. If anyone ever came looking,
          I always thought they'd look in the wrong place."
      compass:
        stance: truth
        reply: >
          "The compass? We gave it to the fisherman's family who pulled us out of the water.
          A small thanks for a big thing. Funny: the old compass went home, and I never
          did."

  # --- The ship -------------------------------------------------------------------------

  ship:
    # The name is the kids' to choose (GAME_STORY.md, questions for the kids).
    name: the Ship
    aliases: [ship, boat]
    where: aboard
    voice: >
      Warm, patient, a teacher: she explains how things work (the sun, clocks, birds,
      tides) in clear steps, and asks questions back instead of giving answers. A ship's
      pride and a little humour. Never tells the solution, only how to find it.
    desc: >
      You can't look at the Ship: you're standing on her. But sometimes her timbers creak
      in a way that sounds almost like a voice.
    greeting: >
      The timbers creak, and somehow it sounds like a voice. "You called? Ask me about
      the sea, the sky, or the instruments below."
    suggest: [sextant, chronometer, latitude, longitude, birds, help]
    fallback: >
      The Ship creaks thoughtfully. "That's beyond what a ship knows. Try me on
      navigation, or on the sea and the sky."
    topics:
      sextant:
        stance: truth
        reply: >
          "The sextant measures how high the sun stands above the horizon. At noon the sun
          is at its highest. Measure it then, on the Deck, look the height up in the
          tables, and you have your |wlatitude|n."
      chronometer:
        aliases: [clock, sea clock]
        stance: truth
        reply: >
          "My chronometer keeps the time of our home port, all voyage long. Mr Harrison
          proved that such clocks can work at sea, but they're new and costly, and few
          ships carry one. Compare it with noon wherever we are, and you'll know your
          |wlongitude|n."
      latitude:
        stance: truth
        reply: >
          "Latitude is how far north or south you are. The higher the noon sun stands, the
          nearer you are to the equator. Sailors have measured it well for centuries: take
          the |wsextant|n up on deck at noon."
      longitude:
        stance: truth
        reply: >
          "Longitude is how far east or west you are, and it's hard. The Earth turns a
          full circle in a day, 15 degrees every hour. So every 4 minutes between noon at
          home, on my |wchronometer|n, and noon here is one degree. Without a good clock,
          longitude is a guess."
      chart:
        stance: truth
        reply: >
          "The Halcyon's chart gives the island's latitude and longitude. If we find empty
          sea there, ask yourself which number to trust: north and south, or east and west?
          Sailors who trust their |wlatitude|n but not their |wlongitude|n sail along the
          latitude until they find land."
      birds:
        aliases: [seabirds, terns, noddies, sky]
        stance: truth
        reply: >
          "Watch the sky at dusk. Terns and noddies fish at sea all day and fly home to land
          for the night. Follow them with your eyes, and you'll know where land is.
          Island navigators have done it for a very long time."
      tide:
        aliases: [tides, low tide, high tide]
        stance: truth
        reply: >
          "The sea rises and falls about twice a day, a little later each day. At low tide
          a reef can stand clear of the water. At high tide it's hidden, and dangerous."
      water:
        aliases: [casks, drink]
        stance: truth
        reply: >
          "Fresh water is life at sea. Every day at sea we drink from the casks in the
          Cabin. Find a spring ashore and you can fill them again."
      help:
        # A4: hints that get more direct while the players are stuck (DECISIONS.md, 6b).
        aliases: [hint, stuck]
        stance: truth
        reply: >
          "Look closely at things, read what's in the Cabin, and ask people questions.
          People don't always tell the truth, so compare what they say. And if something
          puzzles you, ask me about it."
      captain:
        aliases: [command, orders, crew, sailors]
        stance: truth
        reply: >
          "The captain? You are, all of you together: the Society put the expedition in your
          hands. I'll tell you what I know of the sea, but where we go is your choice. Give
          the word on deck: |wsail|n."
      name:
        aliases: [yourself, you]
        stance: truth
        reply: >
          "My name? That's for my crew to decide. Choose well; I'll be wearing it for a
          long time."
