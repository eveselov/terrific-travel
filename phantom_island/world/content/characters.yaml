# The characters of Phantom Island and what they say: `ask <character> about <topic>`.
#
# SPOILERS: this file holds the solution of the mystery. Don't show it to the players.
#
# `stance` isn't used by the game yet: it's a note for the writer, and for the AI characters
# of phase B, who need to know what each character may reveal.
#
# Topic words in replies are marked |wlike this|n (white), so players see what else to ask.
# In a character's text, a white word is always one of *their* topics (players read it as
# "ask me about this"), or a whole command (|waboard|n, |wexamine compass|n). A person or a
# place elsewhere stays plain. The content check enforces it.
# A reply with a `clue` marks the fact itself [[like this]]: the game shows it in yellow and
# writes the clue into the journal (see clues.yaml). Only true clues are marked, never a
# mistaken or lying reply (DECISIONS.md, 20).
# A reply (or greeting, or fallback) that starts with a quote is shown as speech:
# `Old Barnaby says: "..."`. One that starts otherwise is narration, shown as written.
#
# After editing:
#   `batchcode build`, as a builder, for a character's `name`, `aliases`, `desc` or `where`,
#     and for adding or removing a character: the builder copies these into the game.
#   `reload` (or `uv run evennia reload`) is enough for everything else: greetings, topics,
#     replies, `suggest`, `image`, `topic_aliases` are read from this file during play.
#
# How to write replies (DECISIONS.md, 23)
#
# Richness comes from the plot, not the prose: more connections between the people, things
# and clues we already have, not more adjectives. Players act on what they read, so every
# noun is a promise; decoration they can't act on is a false lead.
#   - Short: about 30-60 words, two to four sentences; a greeting one or two. A longer
#     reply is a sign it should be split into a short answer and a new topic. Depth is one
#     question further down, behind a white word, never in one long reply.
#   - The answer first, then one concrete detail that does double duty: vivid *and* a fact
#     that fits the world ("built of good oak" prepares C8; "seas like hills"). A detail
#     that is only pretty gets cut.
#   - Most replies end with at least one white word leading somewhere new: no dead ends.
#   - Name the subject at its first mention in each reply ("the Halcyon", not "she"):
#     players read replies in any order.
#   - There are three ships in this story: the Halcyon, your ship and the boat built on
#     the island. Say "she" or "her" for a ship only right after naming that ship in the
#     same reply, and never when another ship was mentioned in between. Charts, islands
#     and positions are "it".
#   - Figurative language only in a character's own voice, where it shows who they are
#     (Barnaby's sayings, Tui's song). Narration stays plain.
#   - Prefer connections: a reply that points to another character, thing or clue
#     (Barnaby on Crane's compass) is worth more than a new detail.
#   - Every fact is in "The truth" in GAME_STORY.md, or goes into its table of facts that
#     depend on each other (DECISIONS.md, 22).
#   - Voice matters more than length: each character's `voice` says how they speak.
#
# topic_aliases: words that mean the same topic whoever you ask. They apply to every
# character who has a topic with that id; a topic can add its own `aliases` too.
#
# Each character has:
#   name      shown to players
#   aliases   other words players can use for them (`ask barnaby`, `ask sailor`)
#   where     a place id from places.yaml, a list of them (they stand in the first: time is
#             told, not kept, so nobody moves on a clock, DECISIONS.md, 38), or `aboard`
#             (her Deck)
#   desc      what players read when they look at them
#   voice     how they speak: a note for the writer, and for the AI characters of phase B
#   image     optional: URL of their picture, shown in the Focus pane when someone looks at
#             them (without one, a card with their name)
#   greeting  the reply to `ask <character>` with no topic. It names the `suggest` topics in
#             white, in the character's own words (the content check enforces it); the
#             game adds no list, only the Good Hope's (her topics change with where she is)
#   suggest   topics offered to players who don't know what to ask
#   fallback  the polite reply for any topic the character doesn't know; name a topic or
#             two in white there too, so nobody is left without a next question. The game
#             adds what is left to ask, once the player has heard anything from them; a
#             reply asked again gets the same line (world/conversation.py, 2026-11-25)
#   topics    topic id: what they say about it
#   trust     optional: what it takes to win them over (DECISIONS.md, 41): `marks`, the flags
#             set by what players do, each with what earns it, a `label` for the progress
#             shown with each mark ("Elder Ama's respect: 1 of 2. Still to do: ...") and
#             `won`, said with the last one. The progress also follows a refusal that waits
#             on it, once a mark is earned (playtest 2026-11-24)
#   crew      optional: true for one of the ship's crew, who stand on the Deck (`where:
#             deck`). Personality, not plot: the content check allows them no clues, flags,
#             hidden truths or trust, and ideas only as `heard`. Aboard, a question with no
#             name still goes to the Good Hope.
#
# Each topic has:
#   reply     what the character says
#   aliases   optional: other words for this topic, for this character only
#   stance    truth (what they say is true), mistaken (they believe it, but it's wrong),
#             hiding (they know better and don't say)
#   clue      optional: the clue (C1..C13, see GAME_STORY.md) this reply reveals (A3)
#   hidden    optional: true for a topic players find only by thinking of it (the Ship's
#             name). Every other topic must be in `suggest` or white in one of the
#             character's own texts; the content check makes sure of it.
#   (self)    the topic id `self` is what a character says about themselves (`ask barnaby
#             about yourself`, `who are you`); its words are in `topic_aliases`. Optional:
#             without one, a short default. Mark it `hidden: true`.
#   sets      optional: a flag to remember once this topic is asked about (`briefed`: the
#             task appears in the journal and the report, DECISIONS.md, 33)
#   truth     optional, for what a character hides: the reply given once `needs` holds
#     needs   clue ids already in the journal, or flags such as `respect` (set by things
#             players do; the flags come in A4)
#     reply   what they say then
#     clue    the clue that reply reveals
#     sets    optional: a flag to remember once that reply is given (a mark of `trust`)
#   meanwhile optional, before the truth: a list of `needs` and `reply`; the first whose
#             needs hold replaces `reply`, so a refusal names only what is still to do

# Whether players can talk to the crew on the Deck (2026-11-23). Off, the crew still
# welcome the players and speak in councils, and `ask` gets their `busy` answer. Talk
# that leads nowhere can look like a lead (DECISIONS.md, 39), so it stays off for the
# kids' first games; on, for trying it out. `reload` is enough after changing it.
crew_talk: false

topic_aliases:
  halcyon: [the halcyon, ship halcyon, lost ship]
  compass: [brass compass, halcyon compass]
  island: [the island, phantom island]
  storm: [great storm, the storm, storm of 75]
  crew: [sailors, survivors, the crew]
  chart: [map, old chart, the chart]
  reef: [western reef, the reef]
  # "you" counts only as the whole question (`ask ship about you`), never as one word of it.
  self: [yourself, you, name, your name, who are you, about yourself, himself, herself]

characters:
  # --- The port -------------------------------------------------------------------------

  fairweather:
    name: Mrs. Fairweather
    aliases: [fairweather, patron, mrs fairweather]
    where: office
    voice: >
      Formal and precise, a little old-fashioned; full sentences, no slang. Kind but
      businesslike: she chooses her words like someone used to writing letters. Honest
      about how little she knows.
    desc: >
      The patron of the Society: a tall woman in a grey coat, with ink on her fingers and
      a pile of papers she keeps straightening.
    greeting: >
      "Ah, Captain, you've come. The Society has hired a ship, the Good Hope, and a crew for this
      expedition, and put them under your orders: the crew do the sailing, and you decide
      where to go and what to look into. Sit down. I shall tell you of your |wmission|n, of
      the |wHalcyon|n and her |wchart|n, and of her master's last |wletter|n. There is a
      great deal to tell, and very little of it is certain."
    suggest: [mission, halcyon, chart, letter]
    fallback: >
      Mrs. Fairweather frowns politely. "I'm afraid that is outside my knowledge. The
      Society deals in charts and letters, not gossip. Ask me about your |wmission|n, or
      the |wHalcyon|n."
    topics:
      mission:
        aliases: [expedition, job, task]
        stance: truth
        sets: briefed  # the task appears in the journal and the report (DECISIONS.md, 33)
        reply: >
          "The Society wants the truth about the |wHalcyon|n, a ship that sailed from this
          harbour fifteen years ago and never came back: what happened to her, why nobody
          ever found her, and what became of her |wcrew|n. Those are the Society's three
          questions. Your expedition will keep a |wjournal|n of everything you find, with
          the questions written at the top, and when you can prove the answers, you will
          send me your |wreport|n. How you go about it is yours to decide. Talk to everyone, ask
          about everything, and look closely at what you find. The latest news in port is a
          |wcompass|n on Silas Crane's stall, just east of here, and your |wship|n carries
          the
          Halcyon's |wchart|n."
      journal:
        aliases: [diary, notes, log]
        stance: truth
        reply: >
          "Every good expedition keeps a journal. Yours has the Society's three questions at
          the top, and under them everything you find: what it was, where, and who told
          you. Read it whenever you like: |wjournal|n. Remember: what isn't in the journal
          can't prove anything."
      report:
        aliases: [answers, proof]
        stance: truth
        reply: >
          "When you believe you know what happened, answer the Society's questions in your
          report, one at a time: |wreport|n. Choose the answer you believe, and the Society
          will check it against your journal. If the proof isn't there yet, you'll be told
          what's missing, so you can go and find it. You may try at any time."
      halcyon:
        stance: truth
        teaches: {oak: heard}
        reply: >
          "The Halcyon was a sailing ship. She left this harbour in 1775 to chart a small
          |wisland|n far out
          in the ocean. A sound ship, built of good oak, with a careful master. Her last
          |wletter|n reached us, and then nothing. Not a plank, not a word. The families of
          her |wcrew|n still ask me for news."
      chart:
        stance: mistaken
        reply: >
          "The Halcyon's chart is the |wSociety|n's most precious paper, so the original
          stays
          locked away here. A fair copy is waiting for you in your ship's chart house. The
          island
          is drawn on it, with its latitude and longitude written beside it. The Halcyon's
          master was a careful man; I have never had reason to doubt it."
      letter:
        aliases: [last letter]
        stance: truth
        reply: >
          Mrs. Fairweather takes a worn, much-folded letter from the top of her pile. "Her
          master's last letter, in his own hand. I know it by heart, but listen." She reads
          aloud: "'We have found the |wisland|n and fixed its position. Good water, fair
          weather, friendly people. We sail again soon.'" She folds it again. "That was the
          last word we ever had."
      compass:
        stance: truth
        reply: >
          "I have not held it myself: Mr Crane will not let it out of his hands. He says he
          found it on a beach. I should like to know how a compass comes to lie on a beach
          for fifteen years. Do look at it closely: |wexamine compass|n."
      island:
        stance: truth
        reply: >
          "A small island far out in the ocean, to the west. Sailors spoke of it for years,
          but nobody had put it on a chart. That was the Halcyon's task. Her |wchart|n is
          all we know of it; nobody from here has been there since."
      ship:
        aliases: [captain, command, orders]
        stance: truth
        reply: >
          "The Society has hired a sound ship, the Good Hope, and a good crew. Where your
          ship sails is for
          you to decide: you lead this expedition, and the crew will follow your orders. Your
          ship lies at the quay, south-east of here."
      crew:
        stance: truth
        reply: >
          "Good seamen, most of them from this port. Their families still come to my door
          every spring, in case there is news of the |wHalcyon|n. That is why the Society
          never let the matter rest: someone owes them the truth."
      society:
        aliases: [the society]
        stance: truth
        reply: >
          "Our members collect charts, journals and specimens from every voyage they can.
          A map is only as good as the people who made it, so we like to check."
      self:
        hidden: true
        stance: truth
        reply: >
          "I am the patron of the |wSociety|n: I find the money for its voyages and answer
          its letters. I chose this expedition's captain with particular care, so I expect
          the truth, and proof of it."

  barnaby:
    name: Old Barnaby
    aliases: [barnaby, sailor, old sailor]
    where: quay
    voice: >
      An old sailor's talk: short, salty sentences, sea sayings and rhymes, "mark my
      words", "aught". Sure of himself, kindly, fond of a story. Says what he believes,
      and believes the Halcyon sank.
    desc: >
      A retired sailor with a white beard and a pipe that has gone out, sitting on a coil
      of rope as if he owns the quay.
    greeting: >
      Barnaby squints at you. "You'll be one of the Society's lot, then, off on this
      |wexpedition|n after the |wHalcyon|n at last. Your ship's waiting at the end of the
      quay; step |waboard|n when you're ready. But sit down first, if you've a mind to.
      I've time, and stories: of |wthe great storm|n, and of |wsailing|n in my day, mark my
      words."
    suggest: [expedition, halcyon, storm, sailing]
    fallback: >
      Barnaby scratches his beard. "Can't say I know aught about that. Ask me about
      |wthe great storm|n, though."
    topics:
      expedition:
        aliases: [ship, society, voyage]
        stance: truth
        reply: >
          "Whole port's talking of it. The Society's sending a ship to find the |wHalcyon|n,
          fifteen years on, and you're to sail in that ship. Sound ship, well found. Your
          ship lies at the end of the quay: just step |waboard|n. Mind, I'd sooner you came back than
          found anything."
      halcyon:
        stance: mistaken
        reply: >
          "The Halcyon? I watched her sail out of this harbour in '75, sound as a bell. She
          went down in |wthe great storm|n that same season, all hands. I was at sea that
          year myself: no ship could have lived through it. Whatever that |wcompass|n of
          Crane's is, it came off the bottom."
      storm:
        # Barnaby's weather talk is the storm: no weather lore that leads nowhere (23).
        aliases: [weather, sky, wind]
        stance: truth
        teaches: {winds: heard}
        reply: >
          "Worst I ever saw. Three days of wind out of the west, and seas like hills. Out
          of the west, mind: a wind is named for where it comes from, so that one blew
          towards us. If the Halcyon was anywhere near that |wisland|n, she's on the
          bottom, mark my words."
      island:
        stance: truth
        reply: >
          "Never seen it myself. It's far out west, past where any sensible fisherman goes.
          Some of the old hands call it a phantom: here one voyage, gone the next."
      sailing:
        aliases: [navigation, dead reckoning]
        stance: truth
        teaches: {latitude: heard, longitude: heard, dead_reckoning: heard, sea_clocks: heard}
        reply: >
          "In my day we found our way with a compass, a log line and a good guess. Dead
          reckoning, it's called. North and south you could trust, from the noon sun and a
          |wsextant|n. East and west was guesswork. Your ship has one of those new sea
          clocks aboard, I hear. Never trusted 'em myself."
      sextant:
        # The same word as the Ship's, so players meet one instrument, not two (playtest
        # 2026-11-19). Barnaby knows the old way; the Ship explains the new sea clock.
        aliases: [quadrant, latitude, longitude, sea clock, sea clocks, noon sun]
        stance: truth
        reply: >
          "Latitude? Noon sun, a sextant and a steady hand: any old salt can do that.
          Longitude's another matter. In my day it was guesswork. Ask that ship of yours
          about her chronometer: that's the clever clock."
      compass:
        stance: mistaken
        reply: >
          "Crane's been waving that compass at everyone. Washed out of the wreck, I'd say,
          and up on some beach. Ask him where he got it, if you can get a straight answer."
      self:
        hidden: true
        stance: truth
        reply: >
          "Me? Forty years at sea, man and boy, and now I sit on this quay and watch the
          young ones go. I was at sea myself the year of |wthe great storm|n, mind. Ask me
          about that one."

  crane:
    name: Silas Crane
    aliases: [crane, silas, trader]
    where: market
    image: /static/phantom_island/pictures/crane.svg
    voice: >
      A salesman's patter: friendly, quick, too smooth, calls people "friend". Answers a
      question with a shrug or a sales pitch, and goes vague whenever it gets close to
      where the compass came from. Once caught out, grumbling and a little ashamed.
    desc: >
      A trader in a coat too warm for the weather, standing behind a stall of pots, cloth,
      knives and curiosities. His eyes follow your hands.
    greeting: >
      Crane spreads his arms over his stall. "Everything on this table is honestly come by.
      Fine goods, fair |wtrade|n. You'll be wanting the |wcompass|n, I expect: everybody
      does, since they read the word |wHalcyon|n on it. What can I do for you, friend?"
    suggest: [compass, trade, halcyon]
    fallback: >
      Crane shrugs. "Not my line of business, friend. Now, that |wcompass|n..."
    topics:
      compass:
        stance: hiding
        reply: >
          "Found it on a |wbeach|n, I did, washed up after a |wstorm|n. A lucky find. Lucky
          for whoever buys it, too."
        truth:
          needs: [C2]
          clue: C3
          reply: >
            Crane looks at the coral in the hinge and sighs. "All right. I didn't find it.
            I traded for it with [[|wfishermen|n who sailed in from the west]], a long way
            out.
            I kept quiet because people would call me a wreck looter. I'm not. I paid fair."
      beach:
        stance: hiding
        reply: >
          "Which beach? Oh, one down the coast. Can't remember which. They all look the
          same, beaches. Ask old Barnaby on the quay, he's walked every one of them."
      storm:
        stance: hiding
        reply: >
          "Last winter's, the big blow just after the new year. Next morning, there it was
          on the sand, shining. Fresh out of the sea, you might say."
        truth:
          needs: [C2]
          reply: >
            Crane spreads his hands. "Storm? There's always a storm, in a port like this.
            It made a better story than 'bought it off strangers', that's all."
      fishermen:
        aliases: [fisherman, west]
        stance: hiding
        reply: >
          "Fishermen? I deal with all sorts, friend. Couldn't tell one from another."
        truth:
          needs: [C2]
          clue: C3
          reply: >
            "They came in a big canoe with an outrigger, [[from many days' sailing to the
            west]]. They didn't care for brass. They wanted iron nails, and they knew a good
            trade when they saw one."
      halcyon:
        stance: truth
        reply: >
          "The Halcyon? Never knew her. Before my time in this port. But a name like that on
          a |wcompass|n sells, I can tell you."
      trade:
        aliases: [stall, price, buy, sell]
        stance: truth
        reply: >
          "Pots, cloth, knives, a bit of everything. Everything's for sale at the right
          price. That |wcompass|n, now: that one's special."
      self:
        hidden: true
        stance: truth
        reply: >
          "Silas Crane, honest trader. I buy from whoever sails in and sell to whoever walks
          by, and I don't ask where things come from. Questions are bad for |wtrade|n,
          friend."

  # --- The island -----------------------------------------------------------------------

  ama:
    name: Elder Ama
    aliases: [ama, elder]
    where: village
    voice: >
      Slow, calm and proverbial; few words, each one weighed. Speaks in images from the
      island's life (the lagoon, the reef, the generations). Courteous to strangers, and
      waits to see whether they are courteous too.
    desc: >
      An old woman sitting in the shade of a hut, weaving a fishing net with quick, sure
      fingers. Everyone who passes greets her first.
    greeting: >
      The elder looks at you for a long moment. "Strangers from the sea, again. Sit with
      me." She goes on weaving. "You will have come about the ship, the |wHalcyon|n.
      Everyone from the sea does. This is my |wvillage|n, on our |wisland|n. My
      granddaughter |wTui|n plays out on the |wreef|n."
    suggest: [halcyon, village, island, reef, tui]
    fallback: >
      Elder Ama keeps weaving. "That is not something I can tell you about. Ask me about
      my |wvillage|n."
    # Respect is named, taught and acknowledged (DECISIONS.md, 41): the rule is told first
    # (by Tui, or by Ama when asked about the ship too soon), and only what players do
    # after knowing it counts, so nobody earns it by chance.
    trust:
      label: Elder Ama's respect
      marks:
        respect_ama: ask Elder Ama about her village
        respect_tui: ask Tui about her song
      won: She trusts you now. Ask her what you came for.
    topics:
      village:
        aliases: [people, home]
        stance: truth
        reply: >
          "Our people have lived here for more generations than I can count on my fingers
          and toes. The lagoon gives us fish, the forest gives us wood, and the |wreef|n
          keeps the big waves away."
        truth:
          needs: [respect_rule]
          sets: respect_ama
          reply: >
            Elder Ama looks up from her net. "You ask about my people before you ask for
            what you want. That is respect." She weaves on. "Our people have lived here for
            more generations than I can count. The lagoon gives us fish, the forest gives
            us wood, and the |wreef|n keeps the big waves away."
      island:
        stance: truth
        reply: >
          "It is small, but it has all we need. Water at the spring, gardens, the forest.
          Climb the hill and you will see all of it at once."
      reef:
        stance: truth
        teaches: {tides: heard}
        reply: >
          "The western reef keeps old things. Go only at low tide, and walk carefully.
          It is good that you asked before going."
      halcyon:
        aliases: [ship, strangers, wreck]
        stance: hiding
        sets: respect_rule  # the rule, told when strangers ask for what they want first
        reply: >
          "You ask about strangers before you ask about us. A stranger who wants our
          stories shows |wrespect|n first: ask about our people, and be kind to our
          children. Then ask me again."
        meanwhile:  # what is still to do, once some respect is shown (playtest 2026-11-24)
          - needs: [respect_ama]
            reply: >
              "You asked about my people. That was well done. Now be kind to our children:
              Tui wants to sing you her song: |wask tui about song|n. Listen to it, and then
              ask me again."
          - needs: [respect_tui]
            reply: >
              "Tui says you listened to her whole song. That was kind. Now ask about us, about
              my |wvillage|n, before you ask about strangers. Then ask me again."
        truth:
          needs: [respect_ama, respect_tui]
          clue: C12
          sets: cove_told
          reply: >
            "Fifteen winters ago a great storm threw a ship onto the western reef. Our
            people paddled out into the storm and [[brought the whole |wcrew|n ashore,
            alive]]. What they did after, the one who stayed can tell you better than I.
            He lives at the Boat Cove, southwest of the village. His name is Jonah."
      tui:
        aliases: [child, grandchild]
        stance: truth
        reply: >
          "Tui is my grandchild. Tui talks to every stranger and keeps every shiny thing the
          sea gives back. Ask for the |wsong|n: children remember what the old ones forget."
      song:
        aliases: [songs, singing, tui song]
        stance: truth
        teaches: {songs: understood}
        reply: >
          "We do not write on paper. What must not be forgotten, we put into songs, and
          the children learn them before they can count. A song can be older than anyone
          living. Listen to what it says, not only to the tune."
      crew:
        stance: hiding
        sets: respect_rule
        reply: >
          "Those are strangers' stories. Show |wrespect|n first: ask about our people, and
          be kind to our children."
        meanwhile:
          - needs: [respect_ama]
            reply: >
              "You asked about my people. Now listen to Tui's song (|wask tui about song|n),
              and then ask me again."
          - needs: [respect_tui]
            reply: >
              "You listened to Tui. Now ask about my |wvillage|n, and then ask me again."
        truth:
          needs: [respect_ama, respect_tui]
          clue: C12
          sets: cove_told
          reply: >
            "Our people paddled out into the storm and [[brought every one of them ashore,
            alive]]. The rest of their story belongs to the one who stayed. He lives at the
            Boat Cove, southwest of the village: Jonah. Tell him I sent you."
      jonah:
        # Tui sends players here ("Grandmother says that's for her to tell", playtest
        # 2026-11-24). The way to the Cove still comes with the Halcyon's story (C12).
        aliases: [pike, cove, boat cove, carpenter]
        hidden: true
        stance: hiding
        reply: >
          "Jonah's story begins with the ship. When you have shown respect, ask me about the
          |wHalcyon|n."
        meanwhile:
          - needs: [respect_ama, respect_tui]
            reply: >
              "Jonah's story begins with the ship. Ask me about the |wHalcyon|n first."
        truth:
          needs: [cove_told]
          reply: >
            "Jonah lives at the Boat Cove, southwest of the village. Tell him I sent you."
      respect:
        aliases: [rule, rules, manners]
        stance: truth
        reply: >
          "Respect is shown, not said. Ask about the people who live here, not only about
          what you came for. And be kind to our children: Tui is watching you, and so am
          I."
      self:
        hidden: true
        stance: truth
        reply: >
          "I am the eldest here. I have watched the |wreef|n take many things, and give a
          few back. When the young ones want to know what came before them, they come and
          sit with me."

  tui:
    name: Tui
    aliases: [child, kid]
    where: [village, reef]
    voice: >
      A child: excited, quick, jumps from one thing to the next. Short sentences,
      exclamations, funny little details (the goat ate her hat). Repeats what the grown-ups
      say, and sings.
    desc: >
      A child of about ten, barefoot, with a little bag on a string around the neck that
      clinks when Tui moves.
    greeting: >
      "Hello! Are you from a ship? Grandmother says strangers must show |wrespect|n. Do
      you want to see my |wbuttons|n? I found them near the big |wbones|n. I know a
      |wsong|n, too, and I know all the |wgoats|n by name!"
    suggest: [respect, buttons, bones, song, goats]
    fallback: >
      Tui shrugs. "Don't know. Do you want to hear my |wsong|n instead?"
    topics:
      buttons:
        aliases: [bag, shiny]
        stance: truth
        reply: >
          Tui tips out a handful of brass buttons. "Shiny ones! I find them out by the
          |wbig bones|n, and Grandmother has old ones in her basket. Look, this one has a
          little anchor on it. Old |wJonah|n says it's off a sailor's coat."
      bones:
        aliases: [big bones, monster, reef]
        stance: truth
        reply: >
          "At low tide you can walk out to the big bones on the reef. They're huge, bigger
          than a whale! My cousin says a sea monster died there. I don't think so. Monsters
          don't have nails in them."
      song:
        stance: truth
        teaches: {songs: heard}
        clue: C11
        reply: >
          Tui sings:

          "People came out of the sea,
           their big canoe broke on the reef.
           They [[made a new canoe with a white wing
           and flew away to where the sun goes to sleep]]."
        truth:
          # Listening to the child, once you know the rule: the second mark of respect,
          # and the way to the reef (DECISIONS.md, 40 and 41).
          needs: [respect_rule]
          sets: respect_tui
          clue: C11
          teaches: {songs: heard}
          reply: >
            Tui sings:

            "People came out of the sea,
             their big canoe broke on the reef.
             They [[made a new canoe with a white wing
             and flew away to where the sun goes to sleep]]."

            Tui beams. "You listened to the whole song! Grandmother saw. Come on, I'll show
            you the way to the big bones, out on the Western Reef!"
      goats:
        aliases: [goat]
        stance: truth
        reply: >
          "The goats? They came with the sea people, Grandmother says. They eat
          everything! Even my hat, once."
      jonah:
        aliases: [pike, carpenter, cove]
        stance: hiding
        reply: >
          "Old Jonah? He's nice, and he talks funny, like you. He made me a whistle. Where
          he lives? Grandmother says that's for her to tell."
        truth:
          needs: [cove_told]
          reply: >
            "Old Jonah lives by the |wcove|n. He makes boats, and he talks funny, like you.
            He's nice. He made me a whistle."
      respect:
        aliases: [grandmother, ama, elder, rule, rules]
        stance: truth
        sets: respect_rule
        reply: >
          "Grandmother is the oldest in the whole village! She says strangers must show
          respect. Ask her about our village first, not about your ship. And listen to my
          |wsong|n! Then she tells you stories."
        meanwhile:  # the song heard before the rule doesn't count (41): say so (2026-11-24)
          - needs: [respect_tui]
            reply: >
              "You listened to my whole song, and Grandmother saw! Ask her about our village
              too, if you haven't yet. Then she tells you stories."
          - needs: [C11]
            reply: >
              "Grandmother is the oldest in the whole village! She says strangers must show
              respect. Ask her about our village first, not about your ship. And you heard
              my song before you knew, so it didn't count! Ask me for my |wsong|n again.
              Then she tells you stories."
      self:
        hidden: true
        stance: truth
        reply: >
          "I'm Tui! I'm nearly ten, and I know the whole |wsong|n, every word. Grandmother
          says I talk too much. Do you want to see my |wbuttons|n?"

  jonah:
    name: Jonah Pike
    aliases: [jonah, pike, carpenter]
    where: cove
    voice: >
      Plain and tired, a working man's English after fifteen years among islanders; short
      sentences, no fuss. Honest, a little sad, glad to tell it at last. A carpenter's eye
      for wood, boats and how things are made.
    desc: >
      A weathered man with grey hair tied back, shaping a plank with an adze. He dresses
      like the islanders, but his face is sunburnt the way only a sailor's gets.
    greeting: >
      He puts down his adze. "Well. I wondered if anyone would ever come looking. You'll
      want to hear about the |wHalcyon|n, I suppose: the |wwreck|n, the |wcrew|n, the
      |wboat|n we built. Even the old |wcompass|n. Sit down; it's a long story."
    suggest: [halcyon, wreck, boat, crew, compass]
    fallback: >
      Jonah rubs his chin. "Fifteen years here, and I've forgotten more about that than
      I ever knew. Ask me about the |wHalcyon|n, though: that I remember."
    topics:
      self:
        hidden: true
        stance: truth
        clue: C13
        reply: >
          "Jonah Pike. [[I was the Halcyon's carpenter.]] Now I build canoes for the
          village. Fifteen years, and I'm still working out the outriggers. Ask me about
          the |wboat|n we built."
      halcyon:
        stance: truth
        clue: C13
        reply: >
          "[[I was the Halcyon's carpenter.]] Jonah Pike. We found this island, fixed its
          place on the |wchart|n, or thought we had, and anchored off the west side. Then
          the |wstorm|n came."
      wreck:
        aliases: [reef, storm, great storm, sinking]
        stance: truth
        clue: C13
        reply: >
          "Wind out of the west, and the anchors dragged. [[The Halcyon struck the reef in
          the night.]] If the islanders hadn't come out in their canoes, we'd all have
          drowned.
          [[Not one of us was lost.]]"
      boat:
        aliases: [canoe, white wing]
        stance: truth
        clue: C13
        reply: >
          "[[We built the boat right here, from the Halcyon's own oak]], with rope from
          island
          fibre and a sail of patched canvas. A white wing, the children call it."
      crew:
        aliases: [west, the others]
        stance: truth
        clue: C13
        reply: >
          "[[Most of them sailed west in the boat]], to reach the trading routes, not
          |whome|n.
          I never heard what became of them. I stayed. I'd married by then, and this was
          home now."
      home:
        aliases: [east, going home, why west, wind, trade wind]
        stance: truth
        teaches: {winds: understood}
        reply: >
          "Home lies east, and out here the trade wind blows from the east, day after day.
          Beat against it for weeks in a little boat we built ourselves? We'd have run out
          of
          water first. Going west, the wind was behind us all the way."
      chart:
        aliases: [longitude, position]
        stance: truth
        teaches: {sea_clocks: heard, dead_reckoning: heard}
        reply: >
          "Our master swore by his longitude. But we had no sea clock, only dead reckoning
          and his moon tables, and we'd been months at sea. He sent the chart home with his
          |wletter|n. If anyone ever came looking, I always thought they'd look in the
          wrong place."
      letter:
        aliases: [letters, whaler, last letter]
        stance: truth
        reply: >
          "A whaler put in for water while we lay at anchor. Our master sent his letter
          home with her, and a fair copy of his |wchart|n. She sailed a week before the
          |wstorm|n. So the letter got home, and we didn't."
      compass:
        stance: truth
        reply: >
          "The compass? It went down with her. We came ashore with our lives and little
          else. Fifteen years it lay out there on the reef, and last year the boys found it
          at low tide, all grown over. It went east with the traders. Funny: the old compass
          went home, and I never did."

  # --- The crew ---------------------------------------------------------------------------
  # Personality, not plot (2026-11-22): `crew: true` keeps them plot-neutral. The content
  # check allows them no clues, no flags, no hidden truths and no trust, and they teach
  # ideas only as `heard`. On the mystery they defer to the journal and the Good Hope; their
  # mistakes stay on side matters (Tarrant's luck). They speak in councils too.

  rowe:
    name: Mr. Rowe
    aliases: [rowe, mate, thomas rowe, mr rowe, the mate]
    where: deck
    crew: true
    voice: >
      Careful, quiet and exact: short, plain sentences, numbers where he has them, "Steady,
      Captain". Trusts what he has checked and written down, and says so when he doesn't
      know.
    desc: >
      A tall, quiet man in a blue coat, with a logbook under his arm and a pencil behind
      his ear. He looks at everything twice.
    greeting: >
      Mr. Rowe touches his hat. "Captain. I keep the ship's |wlog|n, if you want to know
      how fast we go, and I can tell you how we |wreckon|n our way at sea. Or ask me about
      the |wship|n herself."
    suggest: [log, reckoning, ship]
    busy: >
      Mr. Rowe looks up from his logbook. "Later, Captain, if you'll forgive me. I'll have
      my say in |wcouncil|n."
    fallback: >
      Mr. Rowe considers. "I couldn't say, Captain, not for certain. The Good Hope knows
      more than I do: |wask hope|n. Or ask me about the |wlog|n."
    topics:
      log:
        aliases: [logbook, log line, speed, knots]
        stance: truth
        teaches: {dead_reckoning: heard}
        reply: >
          "Every hour we throw the log: a little board on a long line, with a knot tied
          every few fathoms. We count the knots that run out while a small sandglass
          empties, and that's our speed. That's why a ship's speed is still counted in
          knots. Speed, heading and the hours sailed, it all goes in my logbook."
      reckoning:
        aliases: [reckon, dead reckoning, position, where we are]
        stance: truth
        teaches: {sea_clocks: heard}
        reply: >
          "From the log I work out where we are: so fast, this way, for so long. A good
          reckoning drifts a little every day all the same. The sun puts it right at noon,
          north and south; the Good Hope's sea clock does the rest. I trust that clock,
          Captain. Old Barnaby on the quay never would."
      ship:
        aliases: [good hope, hope, vessel, her]
        stance: truth
        reply: >
          "She's old, Captain, but sound: oak from keel to rail. She creaks when she's
          thinking, the men say." He almost smiles. "I wouldn't know about that."
      halcyon:
        hidden: true  # players think of asking about her themselves
        stance: truth
        reply: >
          "I never sailed with her, Captain, and I won't guess. What we find goes in the
          |wjournal|n. That's what I'd go by."
      self:
        hidden: true
        stance: truth
        reply: >
          "Thomas Rowe, from this port. Twenty years at sea, mate for the last six. My
          father kept a log too. I like a thing written down."

  tarrant:
    name: Ned Tarrant
    aliases: [tarrant, ned, bosun, boatswain, ned tarrant, the bosun]
    where: deck
    crew: true
    voice: >
      Big, loud, salty and kind: "Blow me down", "by thunder", laughs at himself. Full of
      sailors' superstitions and sure of every one of them, but never about the mystery:
      there he admits he doesn't know.
    desc: >
      A big, sunburnt man with arms like ropes and a voice that carries from bow to stern.
      A little carved wooden fish hangs on a cord round his neck.
    greeting: >
      Ned Tarrant grins down at you. "Captain! Ned Tarrant, bosun, at your service. Need a
      |wrope|n spliced, or a |wknot|n tied? Want to know about sea |wluck|n? Or the
      |wweather|n out here?"
    suggest: [ropes, luck, weather]
    busy: >
      Ned Tarrant is bellowing at the men at the ropes. "In council, Captain!" he roars over
      his shoulder. "I'll have my say there!"
    fallback: >
      Ned Tarrant scratches his head. "Blow me down, Captain, that's past me. Ask the Good
      Hope: |wask hope|n. Or ask me about sea |wluck|n!"
    topics:
      ropes:
        aliases: [rope, knot, knots, splice, rigging]
        stance: truth
        reply: >
          "A ship's held together by rope, Captain: miles of it, and every sailor knows his
          knots. A reef knot to join two lines, a bowline for a loop that won't slip. Learn
          the bowline, my old bosun used to say, and you'll never drown for want of a knot."
      luck:
        # Tarrant's mistakes are sailors' superstitions, never the mystery (crew: true).
        aliases: [superstitions, superstition, charm, fish, whistle, albatross, friday]
        stance: mistaken
        reply: >
          "Never whistle on deck, Captain, or you'll whistle up a gale. Never sail on a
          Friday. And never, ever harm an albatross: worst luck there is." He touches the
          carved fish round his neck. "And this keeps me from drowning. Hasn't failed me
          yet!"
      weather:
        aliases: [wind, winds, sky, trade wind]
        stance: truth
        teaches: {winds: heard}
        reply: >
          "Out here the trade wind blows from the south-east, steady as a clock, month
          after month. Named for where it comes from, mind: a south-east wind blows from
          the south-east. Rough weather comes, but this is a kind sea, mostly."
      barnaby:
        hidden: true
        aliases: [old barnaby, old sailor]
        stance: truth
        reply: >
          "Old Barnaby? Sailed with him when I was a lad. Best seaman I ever knew, and the
          last to believe anything new. He'll tell you a sea clock is witchcraft!" He
          laughs.
      halcyon:
        hidden: true
        stance: truth
        reply: >
          "Lost with all hands, they say at home. I don't know, Captain. I just hope we find
          something to tell those families."
      self:
        hidden: true
        stance: truth
        reply: >
          "Ned Tarrant, bosun, born on the quay. Went to sea at eleven, younger than Kit.
          Thirty years, and never once wrecked." He touches his fish. "Never."

  kit:
    name: Kit
    aliases: [kit, kit lowe, youngest]
    where: deck
    crew: true
    voice: >
      About twelve: eager, curious, quick to notice things and to ask questions back. Short
      bursts of words, a lot of exclamation marks. Kit is a girl (2026-11-23).
    desc: >
      The youngest aboard: about twelve, quick and sunburnt, in a shirt a size too big.
      She seems to be everywhere at once, and always has a question.
    greeting: >
      "Captain! Are we really going to find out about the Halcyon? I've never been this
      far out! Do you want to hear about |whome|n? Or what I do on the |wship|n? I know a
      |wsong|n, too!"
    suggest: [home, ship, song]
    busy: >
      Kit waves down at you from the rigging. "In council, Captain! I'll have my say there!"
    fallback: >
      Kit thinks hard. "I don't know! Ask the Good Hope, she knows everything: |wask
      hope|n. Or shall I sing you my |wsong|n?"
    topics:
      home:
        aliases: [mother, family, port]
        stance: truth
        reply: >
          "Home's up the hill behind the market. My mother keeps a lamp in the window while
          the ships are out. I promised to bring her a shell from the other side of the
          ocean."
      ship:
        aliases: [work, job, youngest, deck, masthead, good hope]
        stance: truth
        teaches: {oak: heard}
        reply: >
          "I scrub the deck, fetch and carry, and climb to the masthead to keep a lookout.
          Mr. Rowe is teaching me the log, and Ned teaches me knots. The carpenter says
          she's oak, every plank. Oak's what good ships are made of!"
      song:
        # Just a song: nothing to do with Tui's (no idea taught, 2026-11-23).
        aliases: [shanty, sing, songs, mary]
        stance: truth
        reply: >
          Kit sings, loud and a little out of tune: "Oh, the Mary sailed for Lisbon, and
          the Mary sailed for Spain, and the Mary came home a-limping with her mainmast
          cracked in twain!" Kit grins. "Ned taught me that one!"
      halcyon:
        hidden: true
        stance: truth
        reply: >
          "Everyone at home has a story about her. I just want to know which one's true!"
      self:
        hidden: true
        stance: truth
        reply: >
          "I'm Kit. Kit Lowe! This is my first long voyage."

  # --- The ship -------------------------------------------------------------------------

  ship:
    # The Good Hope: the expedition's ship, sent with the families' hope (2026-11-21).
    name: the Good Hope
    aliases: [hope, good hope, ship, boat]
    where: aboard
    voice: >
      Warm, patient, a teacher: she explains how things work (the sun, clocks, birds,
      tides) in clear steps, and asks questions back instead of giving answers. A ship's
      pride and a little humour. Never tells the solution, only how to find it.
    desc: >
      You can't look at the Good Hope: you're standing on her. But sometimes her timbers
      creak
      in a way that sounds almost like a voice.
    greeting: >
      The timbers creak, and somehow it sounds like a voice. "You called? Ask me about
      the sea and the sky, the |wwind|n, the |wtide|n, the |whorizon|n. Or about the
      instruments in the chart house, and the |wwater|n casks."
    suggest: [course, sextant, chronometer, latitude, longitude, birds, advice]
    fallback: >
      The Good Hope creaks thoughtfully. "That's beyond what a ship knows. Try me on
      navigation, or on the sea and the sky."
    topics:
      sextant:
        stance: truth
        teaches: {latitude: understood}
        reply: >
          "The sextant measures how high the sun stands above the horizon, when used at
          noon, with the sun at its highest. Look the height up in the
          tables, and you have your |wlatitude|n. It lives in the chart house. To find our latitude: |wuse sextant|n."
      chronometer:
        aliases: [clock, sea clock]
        stance: truth
        teaches: {sea_clocks: understood}
        reply: >
          "My chronometer keeps the time of our home port, all voyage long. Mr Harrison
          proved that such clocks can work at sea, but they're new and costly, and few
          ships carry one. Compare it with noon wherever we are, and you'll know your
          |wlongitude|n."
      latitude:
        stance: truth
        teaches: {latitude: understood}
        reply: >
          "Latitude is how far north or south you are. The higher the noon sun stands, the
          nearer you are to the equator. Sailors have measured it well for centuries, with
          the sextant (|wuse sextant|n)."
      longitude:
        stance: truth
        teaches: {longitude: understood}
        reply: >
          "Longitude is how far east or west you are, and it's hard. The Earth turns a
          full circle in a day, 15 degrees every hour. So every 4 minutes between noon at
          home, on my |wchronometer|n, and noon here is one degree. Without a good clock,
          longitude is only |wreckoning|n: a guess."
      chart:
        stance: truth
        teaches: {latitude_sailing: heard}
        reply: >
          "The Halcyon's chart gives the island's latitude and longitude. If we find empty
          sea there, ask yourself which number to trust: north and south, or east and west?
          Sailors who trust their |wlatitude|n but not their |wlongitude|n sail along the
          latitude until they find land."
      course:
        aliases: [position, voyage, destination, heading, where to, coordinates, sail,
          sails, sailing]
        stance: truth
        teaches: {positions: understood}
        reply: >
          "You're the |wcaptain|n: tell me where to go, and I'll take you there. A place at
          sea is two numbers:
          its |wlatitude|n, north or south, and its |wlongitude|n, east or west. The
          Halcyon's |wchart|n in the chart house gives the island's. Then give the order,
          for example: sail to 10 north 25 east."
      reckoning:
        aliases: [dead reckoning, reckon]
        stance: truth
        teaches: {dead_reckoning: understood}
        reply: >
          "Reckoning is working out where you are without seeing land: how fast you
          sailed, which way, and for how long. North and south, the noon sun checks it
          every day. East and west, only a good |wchronometer|n can. Without one, small
          errors add up, day after day. What would that do to a position on a chart?"
      wind:
        aliases: [winds, west wind, east wind, trade wind]
        stance: truth
        teaches: {winds: understood}
        reply: >
          "A wind is named for where it comes from, not where it goes. A west wind blows
          from the west and pushes anything afloat to the
          east: the opposite way to its name."
      horizon:
        aliases: [masthead, lookout, how far]
        stance: truth
        teaches: {horizon: understood}
        reply: >
          "The world is round, so the sea curves away out of sight. From my masthead a
          lookout sees about 20 kilometres of open sea, and a hilly island perhaps 50 to
          70 away. Anything further hides below the horizon, however clear the day. So
          empty sea only tells you there's nothing near."
      witnesses:
        aliases: [witness, truth, lies, liars, stories]
        stance: truth
        teaches: {witnesses: understood}
        reply: >
          "People tell you what they believe, and some tell you what suits them. So ask
          several about the same thing, and compare. Where they agree, it's likely true.
          Where they differ, look for something you can see for yourself: a thing can't
          lie."
      birds:
        aliases: [seabirds, terns, white terns, noddies, noddy, sky]
        stance: truth
        teaches: {seabirds: understood}
        reply: >
          "Watch the sky at dusk. White terns fish at sea all day, as far as a hundred
          miles from land, and fly home to it for the night. Noddies do the same, but never
          stray as far. Follow them with your eyes, and you'll know where land is. Island
          navigators have done it for a very long time."
      tide:
        aliases: [tides, low tide, high tide]
        stance: truth
        teaches: {tides: understood}
        reply: >
          "The sea rises and falls about twice a day, a little later each day. At low tide
          the rocks and reefs near a shore can stand clear of the water. At high tide they're hidden, and dangerous."
      water:
        aliases: [casks, drink]
        stance: truth
        teaches: {fresh_water: understood}
        reply: >
          "Fresh water is life at sea. Every day at sea we drink from the casks in my
          hold. Find a spring ashore and you can fill them again."
      advice:
        # The next step itself comes from `hint` (hints.yaml, DECISIONS.md, 31).
        aliases: [help, hint, hints, stuck, lost]
        stance: truth
        teaches: {witnesses: heard}
        reply: >
          "Look closely at things, read what's in the chart house, and ask people questions.
          People don't always tell the truth, so compare what |wwitnesses|n say. Lost your
          way? Ask me about the |wexpedition|n. A big decision to make at sea? Call a
          |wcouncil|n aboard. Stuck? Type |whint|n, anywhere, and again for more."
      council:
        aliases: [meeting, decision, decide, search, where now]
        stance: truth
        reply: >
          "When the expedition has a big decision to make, call a |wcouncil|n aboard, and
          I'll ask the questions that settle it, one at a time. Not every place needs one:
          I'll tell you when there's nothing to decide."
      expedition:
        aliases: [task, mission, purpose, questions, job]
        stance: truth
        sets: briefed
        reply: >
          "You lead this expedition, and the Society gave you three questions: what
          happened to the Halcyon, why nobody ever found her, and what became of her crew.
          They're at the top of the |wjournal|n, with everything found so far. When you
          can answer one, tell the Society: type |wreport|n."
      captain:
        aliases: [command, orders, crew, sailors]
        stance: truth
        reply: >
          "The captain? You are, all of you together: the Society put the expedition in your
          hands. I'll tell you what I know of the sea, but where we go is your choice. Give
          the word: |wsail|n."
      self:
        hidden: true  # a surprise for whoever thinks of asking her name
        stance: truth
        reply: >
          "My name? The Good Hope. I've worn it for many years, and sailors say a ship
          grows into her name. On this voyage I mean to: the families on the quay are
          hoping too."
