# The clues of Phantom Island: what goes into the expedition's journal.
#
# SPOILERS: this file holds the solution of the mystery. Don't show it to the players.
#
# The authoritative table, with where each clue is found and what it proves, is in
# docs/GAME_STORY.md ("Clues"). This file holds what the game needs from it: a short title
# and the line written into the journal when the clue is found.
#
# A clue is found wherever the other content files say `clue: C<n>`: in a character's reply
# (characters.yaml), a detail of a place (places.yaml, ship.yaml), a thing or what it shows
# when read or used (things.yaml). The text that reveals it marks the fact itself with
# [[double brackets]]; the game shows that part in yellow, then the journal line
# (DECISIONS.md, 20). The content check makes sure every text with a `clue` has a marked
# part, and that no other text does.
#
# The journal line is written from the expedition's point of view. It says what was found,
# and a little of why it matters, but leaves the big conclusions to the players.
#
# Each clue has:
#   title    a few words, shown in the journal and when the clue is found again
#   journal  the line written into the journal
#
# The task (optional) stands at the top of the journal once the expedition has been given
# it, so players can always look up what the expedition is for (DECISIONS.md, 28 and 33).
# Its questions are the ones the report asks at the end. It only states them: which clue
# answers which question is for the players to work out (DECISIONS.md, 21).
#   title      one line: what the expedition is for
#   questions  the questions to answer
#   after      optional: the flag that gives the task (a topic `sets` it); until then,
#   before     what the journal says in its place (and the report's own `before`)
#
# The connections, at the end of this file, are questions that link clues.
#
# After editing, `reload` in the game is enough.

task:
  title: The Society's task is to find out the truth about the Halcyon.
  questions:
    - What happened to the Halcyon, and where?
    - Why did nobody ever find the Halcyon?
    - What became of the Halcyon's crew?
  after: briefed
  before: >
    This journal will hold the clues the expedition finds, for everyone in it. The Society's
    task will stand at the top, once you've been told it.

clues:
  C1:
    title: The Halcyon's compass
    journal: >
      Silas Crane is selling a brass compass engraved HALCYON in the Market. Something of
      the ship survived.
  C2:
    title: Coral in the hinge
    journal: >
      There is coral grown into the compass hinge. Coral only grows under the sea: the
      compass lay in seawater for years, not on a beach as Crane says.
  C3:
    title: Fishermen from the west
    journal: >
      Crane admits he didn't find the compass. He traded for it with fishermen who sailed
      in from many days to the west.
  C4:
    title: Nothing at the charted position
    journal: >
      At the position written on the Halcyon's chart there is only open sea, and the
      sextant and the chronometer can confirm the ship is really there. The chart is wrong.
  C5:
    title: Latitude right, longitude wrong
    journal: >
      Measured at the island with sextant and chronometer: it lies at exactly the latitude
      on the Halcyon's chart, but 1 degree further west than the chart's longitude.
  C6:
    title: Birds flying west at dusk
    journal: >
      At dusk, seabirds that fish far out at sea all fly the same way, west. They go home
      to land for the night.
  C7:
    title: A wreck on the Western Reef
    journal: >
      At low tide the Western Reef shows a ship's oak ribs and an old cannon grown over
      with coral. A ship was wrecked there long ago.
  C8:
    title: Oak timbers in the village
    journal: >
      A hut in the village is built with oak beams. No oak grows on the island: it is ship
      timber, reused by people who lived through the wreck.
  C9:
    title: Goats and onions
    journal: >
      Goats and onions on the island. Neither belongs on an island like this: European
      sailors brought them, and lived here long enough to farm.
  C10:
    title: The coastline on the chart
    journal: >
      From the Hilltop, the island's coastline has exactly the shape drawn on the Halcyon's
      chart. This is the Halcyon's island, only charted in the wrong place.
  C11:
    title: Tui's song
    journal: >
      Tui's song tells of people from the sea whose canoe broke on the reef. They made a new
      canoe with a white wing and flew away to the west.
  C12:
    title: Elder Ama's account
    journal: >
      Elder Ama says her people paddled out into the storm and brought the whole crew of
      the wrecked ship ashore, alive.
  C13:
    title: Jonah Pike's story
    journal: >
      Jonah Pike was the Halcyon's carpenter. She wrecked on the Western Reef in the storm,
      nobody died, and most of the crew sailed west in a boat they built at the cove.

# Connections (optional): questions that link clues, never their answer (DECISIONS.md, 22
# and 30). Once every clue a connection `needs` is in the journal, `think` lists its
# question, marked new for each player until they've seen it (33), and `think <word>`
# shows only the questions about one clue. A question points to where the background lives (the Ship,
# a book, a witness), and leads one step further than the clues' journal lines, towards a
# question of the report. It never states the conclusion.
#   needs     clue ids; an entry can be a list, meaning any one of those clues
#   ideas     optional: notebook ideas (ideas.yaml) that help to answer it. `think` shows
#             those the player has, and where to learn the others (their `learn` text)
#   settled   optional: once any of these holds, the question is settled and leaves `think`:
#             a clue id, a flag (a council's step, `line_settled`), or `report:<question id>`
#             (that report question answered, `report:crew`)
#   question  the question
connections:
  compass_sea:
    needs: [C2, C3]
    ideas: [coral]
    settled: [report:wreck]
    question: >
      The compass lay in the sea for years, and fishermen from the west had it. Coral grew
      in its hinge: where in the sea does coral grow? And where could a compass lie there for
      years, and still be found?
  birds_range:
    needs: [C4, C6]
    ideas: [seabirds, horizon]
    settled: [far_settled]
    question: >
      There is no land at the chart's position, yet the seabirds there fly home to land at
      dusk. How far from land do they fish? The Ship knows: |wask ship about birds|n.
  which_number:
    needs: [C4, C5]
    ideas: [longitude, sea_clocks, dead_reckoning]
    settled: [line_settled, report:why]
    question: >
      At the chart's position the sextant and the chronometer agreed with the chart; at the
      island only the sextant does. Why could the Halcyon's master get one number right and
      the other wrong? |wask ship about longitude|n, or ask someone who sailed with him.
  two_witnesses:
    needs: [C7, C12]
    ideas: [witnesses]
    settled: [report:crew]
    question: >
      Old Barnaby is sure the Halcyon sank with all hands. You have seen her wreck, and
      heard what happened from the island. Which witness was there? (|wask ship about
      witnesses|n)
  oak:
    needs: [C7, C8]
    ideas: [oak]
    settled: [report:crew]
    question: >
      The ribs on the reef and the beams in the village are both oak, from the Halcyon.
      What else could her timber have been used for? Look for a place where something was
      built.
  staying:
    needs: [C8, C9]
    ideas: [onions, island_animals]
    settled: [report:crew]
    question: >
      Ship's timber in a hut, goats and onions in the gardens: it takes time to build and
      to farm. How long did the Halcyon's people stay, and where did they go afterwards?
  white_wing:
    needs: [C11, C8]
    ideas: [songs, oak]
    settled: [report:crew]
    question: >
      Tui's song tells of a canoe with a white wing that flew away to where the sun goes to
      sleep. What kind of boat has a white wing, which way is that, and what could it be
      built of, here?
