# The players' ship: her Deck, and the positions she can sail to.
#
# The ship's Deck never moves. What players see from it, and where the `ashore` exit leads,
# depends on where the ship is. `sail <direction>` on the Deck moves her along a route.
#
# After editing:
#   `batchcode build`, as a builder, for the Deck's `name` and `desc`, and for `ashore_exit`
#     and `aboard_exit`: the builder copies these into the game.
#   `reload` is enough for everything else: the Deck's `details` and all of `positions`
#     (`deck`, `shore`, `details`, `orders`, `suggest`, `routes`...) are read from this
#     file during play.

rooms:
  # The ship is one room, her Deck (DECISIONS.md, 36). The instruments and books are kept in
  # the chart house, a detail of the Deck, so nothing aboard is more than a step away.
  deck:
    name: Deck
    kind: deck        # where `sail` works and the sea and sky are seen
    desc: >
      The deck of the Good Hope, your expedition's ship: masts and rigging overhead, and
      the wheel at the
      stern. Beside the wheel stands a small |wchart house|n, where the instruments and
      books are kept out of the spray. The crew stand ready at the ropes, waiting for the
      expedition's orders: |wsail|n shows where she can go. Now and then her timbers creak
      almost like a voice. The Good Hope herself listens: |wask hope|n anything about the
      sea,
      the sky and the instruments.
    details:
      chart house:
        aliases: [chart table, table, house, shelf, books, instruments]
        desc: >
          A little wooden hut on deck, with a door that faces the wheel. Inside, a chart
          table, the brass |wchronometer|n fixed beside it, the |wsextant|n in its box, the
          Halcyon's |wchart|n, and two books wedged onto a shelf so they can't slide off
          when
          the ship rolls: a |wplant guide|n and an |wanimal guide|n.
      ship:
        aliases: [hope, good hope, boat]
        desc: >
          You can't see the Good Hope whole: you're standing on her. Now and then her
          timbers creak, almost like a voice. She listens: |wask hope|n.
      masts:
        aliases: [mast, rigging, sails, sail, canvas]
        desc: >
          Tall masts of pine, a web of ropes between them, and canvas sails that the crew
          set and furl at your order. Right at the top of the mainmast is the lookout's
          perch, the masthead.
      wheel:
        aliases: [stern, helm, helmsman]
        desc: >
          A big wooden wheel with worn spokes, at the back of the ship. A sailor stands at
          it all day and all night, steering the course you give.
      crew:
        aliases: [sailors, men, ropes, rope]
        desc: >
          Weather-beaten sailors, quick at the ropes and slow to complain. They do the
          sailing; where she goes is yours to say: |wsail|n.
      timbers:
        aliases: [timber, planks, plank, boards]
        desc: >
          Thick oak planks, scrubbed pale with sand and seawater. Oak is the shipwrights'
          wood: heavy, hard, and it lasts. Now and then they creak, almost like a voice.

# The exit from the Deck to the shore, and the one back from the shore to the Deck.
# They only exist while the ship is at a position with `ashore`.
ashore_exit: {key: ashore, aliases: [land]}
aboard_exit: {key: aboard, aliases: [board, ship]}

# The ship herself, seen from the shore she lies off (`look ship` on the Quay or the Lagoon
# Beach): written like a detail in places.yaml, under the id `ship`.
from_shore:
  aliases: [hope, good hope, boat]
  desc: >
    The Good Hope: a sturdy old sailing ship, broad in the beam, her hull black with tar and
    her name in white letters across the stern. When you're ready, go |waboard|n.

# Where the ship is when the game begins.
start: port

# The map shown aboard when a position has no map of its own.
sea_chart: sea_chart

# Each position has:
#   name       a short name for where the ship is
#   coords     optional: where it is on the globe, like `14 S, 40 W` (longitude counted from
#              home, as on the Halcyon's chart). Players can sail to it by naming it:
#              `sail to 14 south 40 west`.
#   orders     optional: what `sail` alone says here, the choices in words. Without it,
#              `sail` lists the directions.
#   search     optional: true where nobody knows the true position yet. An order by
#              position is then read as a direction: the same latitude further west is
#              west (latitude sailing), a changed latitude north or south.
#   suggest    optional: the Ship's topics to offer here (`ask ship`), instead of her usual
#              `suggest` in characters.yaml: what is worth asking her at this place
#   chart_pos  where it is on the sea chart, [x, y]
#   map        optional: a closer map to show aboard instead of the sea chart, and
#   map_pos    the ship's place on it
#   ashore     optional: the place the `ashore` exit leads to
#   deck       what is seen from the Deck here
#   clue       optional: the clue (clues.yaml) the `deck` text reveals, its fact marked
#              [[like this]]. It's found when the ship arrives, or someone looks around.
#   details    optional: what can be seen from the Deck here with `look <detail>`, written
#              like the details in places.yaml
#   shore      what players on the shore see of the ship (only with `ashore`)
#   routes     the ways she can sail from here, by direction (`sail west`). Each has:
#     to         the position she sails to
#     names      optional: other words for the order (`sail to the island`, `sail home`)
#     order      optional: what the Ship says when given this order, heard aboard
#     text       what players aboard read as she sets off
#     passage    the voyage, line by line: one line every few seconds while the ship's
#                marker moves along the sea chart. The last line is the arrival.
#
# The position `under_way` is where the ship is between two others, while a passage is
# told: what the Deck shows meanwhile. It has no routes and no `ashore`.
#
# Distances and days go together (GAME_STORY.md, "Facts that depend on each other"):
# about 200 km a day, so the 40 degrees out to the chart's position take three weeks and
# the 1 degree on to the island (about 108 km) half a day. White terns range about 200 km
# from land and noddies about 65 km, so at the chart's position only white terns are seen,
# and the noddies join them on the way west.
positions:
  port:
    name: Moored at the Quay
    coords: 14 S, 0 W
    suggest: [course, chart, sextant, chronometer, advice]
    orders: >
      The crew stand ready at the ropes, waiting for your order. Where to? Give the place
      as a position, its latitude and its longitude, like this: |wsail to 10 north 25
      east|n. The island's position is written on the Halcyon's chart, in the chart house
      (|wread chart|n).
    chart_pos: [880, 290]
    map: port
    map_pos: [520, 610]
    ashore: quay
    deck: >
      The ship is moored at the quay. Sailors carry the last barrels aboard, and the
      harbour opens to the west, towards the ocean.
    details:
      barrels:
        aliases: [barrel, sailors, stores]
        desc: >
          Salt beef, ship's biscuit and fresh water for many weeks at sea, rolled up the
          plank and down into the hold, one barrel at a time.
      harbour:
        aliases: [harbor, ocean, quay, port]
        desc: >
          The harbour mouth opens to the west. Beyond it lies the ocean, and somewhere far
          out in it, the Halcyon's island.
    shore: >
      The Good Hope, the expedition's ship, is moored at the end of the quay, her sails
      neatly furled.
    routes:
      west:
        teaches: {positions: used, latitude_sailing: understood}
        to: charted
        # Leaving port (DECISIONS.md, 39): the ship sails once Crane has said where the
        # compass came from. One way through: the coral (C2) makes him admit it (C3).
        needs: [C3]
        refused: >
          The Good Hope's timbers creak. "Three weeks across an empty ocean, Captain, on
          the word
          of one old chart? Find out first where that compass really came from. Silas Crane
          in the Market knows more than he says."
        names: [island, chart, chart position, charted position, halcyon island]
        order: >
          The Good Hope's timbers creak, almost like a voice. "Fourteen degrees South, forty
          degrees West: the island on the Halcyon's chart. Look at the chart: our own
          harbour lies at fourteen South too, on the same line of latitude. So the course
          is due west. We check our latitude by the sun every noon, and sail on until my
          |wchronometer|n says we've come forty degrees. About three weeks, with the trade
          |wwind|n behind us. Cast off!"
        text: >
          The ropes are cast off and the sails fill. The port grows small behind you, and
          the coast sinks below the horizon. (The voyage takes a few moments. The crew
          sail her: there's nothing you need to do but watch.)
        passage:
          - >
            Day 4. A steady wind from the southeast fills the sails, day after day. At
            noon the crew measure the sun: fourteen degrees South, the same as home.
          - >
            Day 11. Flying fish skim beside the bow. The water casks are a little
            lighter every day.
          - >
            Day 17. Each day, noon out here comes a little later by the home clock in the
            chart house: four minutes later for every degree the ship has sailed west.
          - >
            Day 21. The Good Hope's timbers creak: "This is the place on the chart, by my
            reckoning. But don't take my word for it: check it yourselves: |wuse sextant|n,
            then |wread chronometer|n."

  charted:
    name: The charted position
    coords: 14 S, 40 W
    # Orders by position are read as a direction here (`search`, DECISIONS.md, 34), and no list
    # of directions is given: which way to search is the players' own choice (25). The
    # decision has its council (councils.yaml, DECISIONS.md, 35).
    search: true
    suggest: [council, birds, horizon, longitude, reckoning, advice]
    orders: >
      Open sea all round, where the chart put the island, and no island. Where now? Give the
      order as a position, |wsail to|n a latitude and a longitude (we are at 14 south, 40
      west), or |wsail home|n. The Good Hope creaks: "A big decision, Captain. Check my
      reckoning
      with the |wsextant|n and my |wchronometer|n first. Then call a |wcouncil|n, and we'll
      settle it one thing at a time."
    chart_pos: [560, 290]
    deck: >
      Open sea in every direction. According to the Halcyon's old chart, the island should
      be right here. [[There is nothing but water, all the way to the |whorizon|n.]] High
      above,
      seabirds wheel in the evening |wsky|n. The Good Hope's timbers creak: "No island,
      Captain.
      Before we search, call a |wcouncil|n, and we'll settle where to look, one thing at a
      time."
    clue: C4
    details:
      horizon:
        aliases: [sea, water, ocean]
        desc: >
          Water meets sky in a clean, empty line all round the ship. How far away is that
          line? |wask hope about horizon|n.
      sky:
        teaches: {seabirds: used}
        aliases: [birds, seabirds, terns, white terns, evening, dusk]
        clue: C6
        desc: >
          The sun is going down. The white terns that fished around the ship all day are
          leaving, in long lines low over the water, [[all flying the same way: west]].
    routes:
      west:
        teaches: {latitude_sailing: used}
        to: anchorage
        order: >
          "West it is," the Good Hope creaks. "On past the end of the chart, along the same
          latitude."
        text: >
          The ship turns west and sails on, beyond the place where the chart put the
          island.
        passage:
          - >
            Morning. Nothing but sea ahead. A lookout climbs to the masthead.
          - >
            Late morning. There are more seabirds now, fishing ahead of the bow: small
            dark |wnoddies|n among the white terns.
          - >
            Early in the afternoon the lookout shouts from the masthead: land!
      # A day's search north, south or east finds nothing, and the instruments say why
      # (things.yaml): it costs time and water, and teaches. About 200 km a day: 2 degrees.
      north:
        to: north_of_chart
        order: >
          "North it is," the Good Hope creaks. "A day's sail, and we'll see."
        text: >
          The ship turns north and sails on.
        passage:
          - >
            Morning. Nothing ahead but sea. A lookout climbs to the masthead.
          - >
            Evening, and still nothing in sight. The water casks are a day lighter. The
            Good Hope creaks: "A day north of the chart's position. The |wsextant|n
            will tell you how far we've come from the chart's latitude."
      south:
        to: south_of_chart
        order: >
          "South it is," the Good Hope creaks. "A day's sail, and we'll see."
        text: >
          The ship turns south and sails on.
        passage:
          - >
            Morning. Nothing ahead but sea. A lookout climbs to the masthead.
          - >
            Evening, and still nothing in sight. The water casks are a day lighter. The
            Good Hope creaks: "A day south of the chart's position. The |wsextant|n
            will tell you how far we've come from the chart's latitude."
      east:
        to: east_of_chart
        order: >
          "East it is," the Good Hope creaks. "Back the way we came, for a day."
        text: >
          The ship turns east and sails back along her own wake.
        passage:
          - >
            Morning. Nothing ahead but sea. A lookout climbs to the masthead.
          - >
            Evening, and still nothing in sight. The water casks are a day lighter. The
            Good Hope creaks: "A day east of the chart's position. We sailed
            through these very waters on our way out, remember?"
      home:
        to: port
        names: [port, harbour, harbor]
        order: >
          "Home it is," the Good Hope creaks. "It will be slower going back: the wind is
          against us."
        text: >
          The ship turns for home.
        passage:
          - >
            Day after day the ship beats back and forth against the wind. Going home is
            slower than coming out.
          - >
            At last the familiar harbour comes into view.

  north_of_chart:
    name: A day north of the chart's position
    coords: 12 S, 40 W
    suggest: [sextant, latitude, longitude, advice]
    orders: >
      Open sea, a day's sail north of the chart's position. You can |wsail south|n, back
      to it.
    chart_pos: [560, 200]
    deck: >
      Open sea in every direction, and no island anywhere. The wind hums in the rigging.
    details: &open_sea
      sea:
        aliases: [water, waves, horizon, wind, rigging]
        desc: >
          Grey-blue waves in long rows, the wind humming in the rigging, and an empty
          horizon all round. Nothing to steer by but the sun and the instruments.
    routes:
      south: &back_to_chart
        to: charted
        names: [chart position, charted position]
        text: >
          The ship turns back towards the chart's position.
        passage:
          - >
            A day's sail over an empty sea.
          - >
            The Good Hope creaks: "Back at the chart's position: fourteen South, forty West."

  south_of_chart:
    name: A day south of the chart's position
    coords: 16 S, 40 W
    suggest: [sextant, latitude, longitude, advice]
    orders: >
      Open sea, a day's sail south of the chart's position. You can |wsail north|n, back
      to it.
    chart_pos: [560, 380]
    deck: >
      Open sea in every direction, and no island anywhere. The wind hums in the rigging.
    details: *open_sea
    routes:
      north: *back_to_chart

  east_of_chart:
    name: A day east of the chart's position
    coords: 14 S, 38 W
    suggest: [sextant, longitude, chronometer, advice]
    orders: >
      Open sea, a day's sail east of the chart's position. You can |wsail west|n, back to
      it, or |wsail home|n.
    chart_pos: [660, 290]
    deck: >
      Open sea in every direction, and no island anywhere. The wind hums in the rigging.
    details: *open_sea
    routes:
      west: *back_to_chart
      home:
        to: port
        names: [port, harbour, harbor]
        order: >
          "Home it is," the Good Hope creaks. "It will be slower going back: the wind is
          against us."
        text: >
          The ship turns for home.
        passage:
          - >
            Day after day the ship beats back and forth against the wind. Going home is
            slower than coming out.
          - >
            At last the familiar harbour comes into view.

  anchorage:
    name: Anchored off the island
    coords: 14 S, 41 W
    suggest: [council, tide, wind, witnesses, advice]
    chart_pos: [450, 290]
    map: island
    map_pos: [875, 545]
    ashore: beach
    deck: >
      The ship lies at anchor in a calm lagoon. A green island rises in front of you, with
      a white beach and palm trees along the shore. The Good Hope's timbers creak: "Take the
      guides from the chart house ashore, Captain. With a guide in your hands, you'll see
      more in what you look at. And when you've seen enough, come back aboard and call a
      |wcouncil|n: we'll put the Society's answers together."
    details:
      island:
        aliases: [beach, palms, palm trees, lagoon, shore]
        desc: >
          Green hills under a blue sky, a white beach, and palm trees leaning over the
          water. Somewhere in there are the answers the Society wants. Go |washore|n.
    shore: >
      Your ship lies at anchor out in the lagoon. When you've seen enough of the island, go
      back |waboard|n and call a council with the Good Hope: she'll help you put it
      together.
    routes:
      east:
        to: charted
        names: [chart position, charted position]
        text: >
          The anchor comes up and the island falls behind you as the ship sails east.
        passage:
          - >
            The island sinks below the horizon behind you.
          - >
            By evening there is only sea again, where the chart put the island.

  under_way:
    name: Under way
    chart_pos: [720, 290]
    deck: >
      The ship is under way, leaning a little in the wind. Spray comes over the bow, and
      the crew are busy at the ropes. All around, the sea stretches to the horizon.
    details:
      sea:
        aliases: [spray, bow, waves, horizon, water]
        desc: >
          The bow lifts and falls, throwing up spray that tastes of salt. The waves run on
          ahead of you, all the way to the horizon.
