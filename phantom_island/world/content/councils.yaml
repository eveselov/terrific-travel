# Councils: where exploring must converge on one decision (`council`, DECISIONS.md, 35).
#
# SPOILERS: this file holds the way to the island. Don't show it to the players.
#
# Exploring has no single result; at a convergence point many findings must become one
# decision. A council gives that a process: the captain types `council` aboard, and the Ship
# asks the decision's parts one at a time. Each part should rule something out (DECISIONS.md,
# 34); a decision with no parts is a guess. Only the journal counts: the right choice is
# accepted once its `proof` holds, and until then the Ship says where to look (`missing`)
# and the council waits. A wrong choice's `reply` leads back to the evidence, never to
# failure. The summary sums up and leaves the order to the captain. It is offered, never
# forced: players who know can just act.
#
# Each council has:
#   at        the ship's position (ship.yaml) where it is held, aboard
#   opening   what the Ship says when the council is first called
#   steps     the parts of the decision, in order; each has:
#     id        a short name
#     question  what the Ship asks (in her voice, with the quotes)
#     sets      the flag remembered once the step is settled (hints can use it)
#     choices   two to five; exactly one has `right: true`. Each has `text` and `reply`
#               (said once it is chosen: why not, or, for the right one, why yes); the
#               right one has `proof`: a list of parts, each needing any one of its `clues`
#               (clue ids or flags), with `missing`, said while it doesn't hold
#   summary   the decision, once every step is settled, and what is left to the captain
#   concludes optional: the report questions this council answers (report.yaml question id:
#             the conclusion, short). Once every step is settled, the report shows it under
#             the question, and the summary is followed by the command that writes it in
#             the report (`report 2 d`) once the journal proves it (DECISIONS.md, 37). The
#             council guides; the captain still signs the report.
#
# The game frames the texts: "<player> answers: b) ...", and a quiet line saying how to
# answer, or that the council waits. After editing, `reload` in the game is enough.

councils:
  charted:
    at: charted
    opening: >
      The crew gather on the Deck, and the Ship's timbers creak: "Open sea, Captain, where
      the chart put the island. So the chart is wrong somewhere. Let's settle it, one thing
      at a time."
    steps:
      - id: line
        sets: line_settled
        question: >
          "First: the chart gives two numbers. Which one could the Halcyon's master have got
          wrong without knowing it?"
        choices:
          - text: The latitude, north or south.
            reply: >
              "The noon sun gave him his latitude every day, and our |wsextant|n agrees with
              his chart. Which number had he no way to check?"
          - text: The longitude, east or west.
            right: true
            reply: >
              "Yes. Without a sea clock, longitude is only a reckoning, and small errors add
              up. His latitude was right, so the island lies on our own latitude: east of us,
              or west."
            proof:
              - clues: [sight_charted]
                missing: >
                  "Before we blame the chart, check my reckoning, Captain: take a noon sight
                  with the |wsextant|n, then read my |wchronometer|n.
                  Then call the council again."
          - text: Both of them.
            reply: >
              "Our |wsextant|n agrees with his latitude: that one he measured, every noon. Is
              there one he could only guess?"
      - id: side
        sets: side_settled
        question: >
          "Second: east or west?"
        choices:
          - text: East.
            reply: >
              "East is the way we came: three weeks of empty sea behind us. Is there anything
              in the journal that points the other way?"
          - text: West.
            right: true
            reply: >
              "West. That's what the journal says, and whatever told it, birds or fishermen,
              knows this sea better than the chart does."
            proof:
              - clues: [C6]
                missing: >
                  "Something here knows where land is. Watch the |wsky|n at dusk,
                  Captain, and call the council again."
          - text: There's no way to tell.
            reply: >
              "Is there not? Something here knows where land is, and somebody in port knew
              where the compass came from."
      - id: far
        sets: far_settled
        question: >
          "Third: how far west? Out here, one degree of longitude is about 107 kilometres, or
          67 miles. Think of how far from land the terns fish, and how far my lookout can
          see."
        choices:
          - text: Less than half a degree.
            reply: >
              "Then my lookout would see it from the masthead. Ask me about the |whorizon|n if
              you doubt it."
          - text: About one degree.
            right: true
            reply: >
              "About one degree. Further than my lookout can see, so we see nothing, but well
              within a tern's flight home, so they fish here. Close, Captain: a day's sail."
            proof:
              - clues: [C6]
                missing: >
                  "Have you watched the terns here at dusk? Look at the |wsky|n,
                  Captain, and call the council again."
          - text: Ten degrees or more.
            reply: >
              "Then why are terns fishing all round us? Ask me how far they go from land:
              |wask ship about birds|n."
          - text: There's no way to tell.
            reply: >
              "There is: the terns and the horizon together. |wask ship about birds|n, and
              about the |whorizon|n."
    summary: >
      The Ship's timbers creak: "So the council agrees. The Halcyon's master had his latitude
      right and his longitude wrong. The island lies west of us, on our own latitude, about a
      degree away. We are at 14 south, 40 west, so one degree further west is 41 west. It's
      still a judgement, not a certainty, but it's the best the council can make. The order
      is yours, Captain: |wsail to 14 south 41 west|n. And it answers one of the Society's
      questions too: why nobody ever found her."
    concludes:
      why: >
        The chart's latitude is right, and its longitude was reckoned about a degree too far
        east, so everyone searched in the wrong place.

  # The final council (DECISIONS.md, 37): back aboard at the island, once the evidence is
  # ashore to be found, the Society's two other questions, one part at a time.
  island:
    at: anchorage
    opening: >
      The crew gather on the Deck, and the Ship's timbers creak: "We've found the Halcyon's
      island, Captain, and you've walked it. Now the Society's questions. Let's put together
      what the journal knows, one thing at a time."
    steps:
      - id: where
        sets: wreck_settled
        question: >
          "First: where did the Halcyon's voyage end?"
        choices:
          - text: She sank far out at sea, in the great storm of '75.
            reply: >
              "That's Old Barnaby's belief, and he never saw this island. A ship lost far out
              at sea leaves nothing near land. Has the island shown you nothing of her?"
          - text: On the island's Western Reef, in the great storm of '75.
            right: true
            reply: >
              "On the reef. Her ribs are still out there, grown over with coral, and a
              compass from her lay in that shallow water for years."
            proof:
              - clues: [C7]
                missing: >
                  "Something of her is on this island, Captain: on the Western Reef. Walk out
                  there, and look. Then call the council again."
          - text: She sailed on from the island, and was lost somewhere else.
            reply: >
              "Then the island would hold nothing of her. Look again at what lies on the
              Western Reef, and what the people here remember."
      - id: survivors
        sets: survivors_settled
        question: >
          "Second: did anyone live through the wreck?"
        choices:
          - text: No. All hands were lost.
            reply: >
              "That's what they believe at home, where nobody saw it. Who on this island
              was here when it happened?"
          - text: Yes. The whole crew came ashore alive.
            right: true
            reply: >
              "All of them. The islanders paddled out into the storm and brought them in.
              Not one was lost."
            proof:
              - clues: [C12]
                missing: >
                  "Someone here remembers that night, Captain: the eldest of the village.
                  Win her trust, hear it from her, then call the council again."
          - text: Only a few of them.
            reply: >
              "Who told you of anyone lost? Ask those who were there."
      - id: stayed
        sets: stayed_settled
        question: >
          "Third: how long did they stay?"
        choices:
          - text: A few days, until the storm was over.
            reply: >
              "A few days? Then who planted what grows here, and whose animals graze above
              the beach?"
          - text: A season or more, long enough to plant and to farm.
            right: true
            reply: >
              "Long enough to plant onions by the spring, and to leave their goats behind.
              Sailors carry both, and plant and keep them where they stay a while."
            proof:
              - clues: [C9]
                missing: >
                  "Look at what grows by the spring, Captain, and what grazes above the
                  beach, with the guides from my chart house. Then call the council again."
          - text: All their lives. They never left.
            reply: >
              "Then where are they? Only one sailor lives on the island now."
      - id: went
        sets: crew_settled
        question: >
          "Last: where are they now?"
        choices:
          - text: They all stayed, and their children live here now.
            reply: >
              "Then where is everybody? Only one sailor still lives on the island."
          - text: Most of them sailed west, in a boat they built here, and one stayed.
            right: true
            reply: >
              "West, with the trade wind behind them, in a boat of the Halcyon's own oak.
              And one of them never left."
            proof:
              - clues: [C8]
                missing: >
                  "Something was built from the Halcyon herself, Captain. Look closely at
                  what the village is built of. Then call the council again."
              - clues: [C11]
                missing: >
                  "The children remember how they left, Captain. Listen to Tui's song. Then
                  call the council again."
              - clues: [C13]
                missing: >
                  "And one of them never left, Captain. Find him, and hear it from him. Then
                  call the council again."
          - text: They sailed home, east, and were lost on the way.
            reply: >
              "East, against the trade wind, for weeks, in a little boat? Ask me about the
              |wwind|n out here, Captain."
    summary: >
      The Ship's timbers creak: "So the council agrees. The Halcyon was wrecked on the
      Western Reef in the great storm of '75. The islanders saved her whole crew, and most of
      them sailed west in a boat they built from her oak, while one stayed. That's what the
      Society asked, Captain. It's yours to write in the report, and yours to sign."
    concludes:
      wreck: >
        She was wrecked on the island's Western Reef, in the great storm of '75.
      crew: >
        The islanders saved the whole crew; most sailed west in a boat they built, and one
        stayed.
