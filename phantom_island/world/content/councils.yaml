# Councils: where exploring must converge on one decision (`council`, DECISIONS.md, 35).
#
# SPOILERS: this file holds the way to the island. Don't show it to the players.
#
# Exploring has no single result; at a convergence point many findings must become one
# decision. A council gives that a process: the captain types `council` aboard, and the Ship
# asks the decision's parts one at a time. Each part should rule something out (DECISIONS.md,
# 34); a decision with no parts is a guess. Only the journal counts: the right choice is
# accepted once its `proof` holds, and until then the Ship says where to look (`missing`)
# and the council waits. A wrong choice's `reply` leads back to the evidence, never to
# failure. The summary sums up and leaves the order to the captain. It is offered, never
# forced: players who know can just act.
#
# Each council has:
#   at        the ship's position (ship.yaml) where it is held, aboard
#   opening   what the Ship says when the council is first called
#   steps     the parts of the decision, in order; each has:
#     id        a short name
#     question  what the Ship asks (in her voice, with the quotes)
#     sets      the flag remembered once the step is settled (hints can use it)
#     agreed    what the council has agreed once it is settled, short and lower case: said
#               when the council is called again ("Agreed so far: the island lies west")
#     choices   two to five; exactly one has `right: true`. Each has `text` and `reply`
#               (said once it is chosen: why not, or, for the right one, why yes; said by
#               the crew, 2026-11-22: Mr. Rowe the mate weighs the evidence, Ned Tarrant
#               the bosun objects bluntly and cheers loudest, young Kit asks the plain
#               questions; the Good Hope asks the questions, opens and sums up); the
#               right one has `proof`: a list of parts, each needing any one of its `clues`
#               (clue ids or flags), with `missing`, said while it doesn't hold
#   summary   the decision, once every step is settled, and what is left to the captain
#   concludes optional: the report questions this council answers (report.yaml question id:
#             the conclusion, short). Once every step is settled, the report shows it under
#             the question, and the summary is followed by the command that writes it in
#             the report (`report 2 d`) once the journal proves it (DECISIONS.md, 37). The
#             council guides; the captain still signs the report.
#
# The game frames the texts: "<player> answers: b) ...", and a quiet line saying how to
# answer, or that the council waits. After editing, `reload` in the game is enough.

councils:
  # The first council (2026-11-22): before leaving port, two quick steps that teach how a
  # council works, and the port's gate in the crew's voice (C3, DECISIONS.md, 39).
  port:
    at: port
    opening: >
      The crew gather on the Deck: Mr. Rowe with his logbook, Ned Tarrant still bellowing
      at the men with the barrels, and Kit at the front, all ears. The Good Hope's timbers
      creak: "A council before we cast off, Captain? Good. Two things to settle, and then
      the order is yours."
    steps:
      - id: destination
        sets: destination_settled
        agreed: we sail for the island on the Halcyon's chart
        question: >
          "First: where do we sail to?"
        choices:
          - text: To the island on the Halcyon's chart.
            right: true
            reply: >
              Ned Tarrant nods. "Aye, that's a place a ship can steer for." Mr. Rowe opens
              his logbook. "Its latitude and longitude are written on the chart. That's
              where we're bound."
            proof:
              - clues: [chart_read]
                missing: >
                  Mr. Rowe nods. "Aye, Captain, but where is it, exactly? Its position is
                  written on the chart, in the chart house: |wread chart|n. Then call the
                  council again."
          - text: To wherever Crane's fishermen came from.
            reply: >
              Kit frowns. "But 'many days to the west' isn't a place, is it? You can't steer
              for that. Isn't there somewhere written down?"
          - text: Nowhere yet. We stay in port.
            reply: >
              Ned Tarrant groans. "Stay in port? With the barrels stowed and the wind fair?
              The Society didn't hire us to sit on the quay, Captain!"
      - id: worth
        sets: worth_settled
        agreed: something of the Halcyon really is out there
        question: >
          "Second: three weeks across an empty ocean, on the word of one old chart. Is there
          anything that says something of the Halcyon is out there to be found?"
        choices:
          - text: Nothing at all. We go on hope.
            reply: >
              Mr. Rowe shakes his head. "Steady, Captain. The sea is wide, and hope won't fill
              the water casks. Has nothing in this port come from out there?"
          - text: Yes. Her compass came back, from somewhere out there.
            right: true
            reply: >
              Kit grins, and Ned Tarrant claps his hands. "That's the stuff!" Mr. Rowe nods.
              "Her compass came in with fishermen from the west. Something of her survived
              out there, and that's worth three weeks of sea."
            proof:
              - clues: [C3]
                missing: >
                  Mr. Rowe nods. "Aye, but Silas Crane says he found it on a beach, right here.
                  Find out where it really came from, Captain: he knows more than he says.
                  Then call the council again."
          - text: The chart says so, and that's enough.
            reply: >
              Kit asks: "But the chart was drawn fifteen years ago. Nobody has seen her
              since. Is there anything newer?"
    summary: >
      The crew cheer, and Ned Tarrant is already shouting for the lines. The Good Hope's
      timbers creak: "So the council agrees: we sail for the island on the Halcyon's chart.
      Not just 'west', Captain: give the order as a position, its latitude and its
      longitude, just as the chart writes them: |wsail to 14 south 40 west|n."

  charted:
    at: charted
    opening: >
      The crew gather on the Deck once more: Mr. Rowe with his logbook, Ned Tarrant with
      his arms folded, and Kit squeezing in at the front. The Good Hope's
      timbers creak: "Open sea, Captain, where the chart put the island. So the chart is
      wrong somewhere. Let's settle it, one thing at a time."
    steps:
      - id: line
        sets: line_settled
        agreed: the chart's longitude is wrong, and its latitude right
        question: >
          "First: the chart gives two numbers. Which one could the Halcyon's master have got
          wrong without knowing it?"
        choices:
          - text: The latitude, north or south.
            reply: >
              Mr. Rowe shakes his head. "Steady, Captain. The noon sun gave the Halcyon's
              master his latitude every day, and our |wsextant|n agrees with his chart.
              Which number had he no way to check?"
          - text: The longitude, east or west.
            right: true
            reply: >
              Ned Tarrant slaps the rail. "Aye, that's it!" Mr. Rowe nods slowly. "Without
              a sea clock, longitude is only a reckoning, and small errors add up. His
              latitude was right, so the island lies on our own latitude: east of us, or
              west."
            proof:
              - clues: [sight_charted]
                missing: >
                  Mr. Rowe raises a hand. "Aye, that sounds right, Captain. But before we
                  blame the chart, let's be sure where we are ourselves: |wuse sextant|n,
                  then |wread chronometer|n. Then call the council again."
          - text: Both of them.
            reply: >
              Kit frowns. "Both? But our |wsextant|n agrees with him about the latitude.
              He measured that one every noon, didn't he? Is there one he could only guess?"
      - id: side
        sets: side_settled
        agreed: the island lies west of the chart's position
        question: >
          "Second: east or west?"
        choices:
          - text: East.
            reply: >
              Ned Tarrant snorts. "East? Blow me down, Captain, east is where we came from:
              three weeks of empty sea, and not a twig of land. Is there anything in the
              journal that points the other way?"
          - text: West.
            right: true
            reply: >
              Kit whoops, and Ned Tarrant laughs. "West it is!" Mr. Rowe taps his logbook.
              "That's what the journal says, and the birds know this sea better than any
              chart."
            proof:
              - clues: [C6]
                missing: >
                  Mr. Rowe nods. "West sounds right to me too, Captain, but we don't know it
                  yet. Something here knows where land is. Watch the |wsky|n at dusk, and
                  call the council again."
          - text: There's no way to tell.
            reply: >
              Kit points up. "But the birds, Captain! They must live somewhere. Can't they
              tell us?"
      - id: far
        sets: far_settled
        agreed: it lies about one degree further west
        question: >
          "Third: how far west? Out here, one degree of longitude is about 107 kilometres,
          or
          67 miles. Think of how far from land the terns fish, and how far my lookout can
          see."
        choices:
          - text: Less than half a degree.
            reply: >
              Ned Tarrant shakes his head. "Half a degree? Then the lookout would see it
              from the masthead, by thunder, and he sees nothing. Ask the Good Hope how far
              a lookout sees: |wask hope about horizon|n."
          - text: About one degree.
            right: true
            reply: >
              The crew cheer, and Mr. Rowe smiles for the first time. "About one degree.
              Further than the lookout can see, so we see nothing, but well within a tern's
              flight home, so they fish here. Close, Captain: a day's sail."
            proof:
              - clues: [C6]
                missing: >
                  Mr. Rowe rubs his chin. "That fits the numbers, Captain, but have you
                  watched the terns here at dusk? Look at the |wsky|n, and call the council
                  again."
          - text: Ten degrees or more.
            reply: >
              Kit looks up at the birds. "Ten degrees? Then why are the terns fishing all
              round us? Ask the Good Hope how far they go from land: |wask hope about
              birds|n."
          - text: There's no way to tell.
            reply: >
              Mr. Rowe opens his logbook. "There is a way, Captain: the terns and the
              horizon together. |wask hope about birds|n, and |wask hope about horizon|n."
    summary: >
      The crew cheer, and Ned Tarrant is already shouting for the sails.
      The Good Hope's timbers creak: "So the council agrees. The Halcyon's master had his
      latitude
      right and his longitude wrong. The island lies west of us, on our own latitude, about
      a
      degree away. We are at 14 south, 40 west, so one degree further west is 41 west. It's
      still a judgement, not a certainty, but it's the best the council can make. The order
      is yours, Captain: |wsail to 14 south 41 west|n. And it answers one of the Society's
      questions too: why nobody ever found her."
    concludes:
      why: >
        The chart's latitude is right, and its longitude was reckoned about a degree too far
        east, so everyone searched in the wrong place.

  # The final council (DECISIONS.md, 37): back aboard at the island, once the evidence is
  # ashore to be found, the Society's two other questions, one part at a time.
  island:
    at: anchorage
    opening: >
      The crew gather on the Deck again: Mr. Rowe with his logbook open, Ned Tarrant
      sunburnt and cheerful, and Kit, who has been staring at the island all day. The Good
      Hope's timbers creak: "We've found the Halcyon's island, Captain, and you've walked
      it. Now the Society's questions. Let's put together what the journal knows, one thing
      at a time."
    steps:
      - id: where
        sets: wreck_settled
        agreed: the Halcyon was wrecked on the island's Western Reef
        question: >
          "First: where did the Halcyon's voyage end?"
        choices:
          - text: She sank far out at sea, in the great storm of '75.
            reply: >
              Ned Tarrant shakes his head. "That's Old Barnaby's yarn, and he never saw this
              island. A ship lost far out at sea leaves nothing near land. Has the island
              shown you nothing of her?"
          - text: On the island's Western Reef, in the great storm of '75.
            right: true
            reply: >
              Kit gasps, and the crew murmur: "Aye." Mr. Rowe nods. "On the reef. Her ribs
              are still out there, grown over with coral, and her compass lay in that
              shallow water for years."
            proof:
              - clues: [C7]
                missing: >
                  Mr. Rowe nods. "It may well be, Captain, but we haven't seen it. Something
                  of her is on this island: on the Western Reef. Walk out there, and look.
                  Then call the council again."
          - text: She sailed on from the island, and was lost somewhere else.
            reply: >
              Kit frowns. "Then why would anything of her be here? What's out on the
              Western Reef, then? And what do the people here remember?"
      - id: survivors
        sets: survivors_settled
        agreed: her whole crew came ashore alive
        question: >
          "Second: did anyone live through the wreck?"
        choices:
          - text: No. All hands were lost.
            reply: >
              Mr. Rowe closes his logbook. "That's what they believe at home, where nobody
              saw it. Who on this island was here when it happened?"
          - text: Yes. The whole crew came ashore alive.
            right: true
            reply: >
              Ned Tarrant whoops and throws his hat in the air. "All of them! Not one man
              lost!" Mr. Rowe smiles. "The islanders paddled out into the storm and brought
              them in."
            proof:
              - clues: [C12]
                missing: >
                  Mr. Rowe nods. "I'd like to believe it, Captain, but we must hear it from
                  someone who was there: the eldest of the village. Win her trust, hear it
                  from her, then call the council again."
          - text: Only a few of them.
            reply: >
              Kit asks: "Who told us about anyone lost? Shouldn't we ask the people who were
              there?"
      - id: stayed
        sets: stayed_settled
        agreed: they stayed a season or more
        question: >
          "Third: how long did they stay?"
        choices:
          - text: A few days, until the storm was over.
            reply: >
              Ned Tarrant laughs. "A few days? Then who planted what grows here, and whose
              goats are those above the beach?"
          - text: A season or more, long enough to plant and to farm.
            right: true
            reply: >
              Ned Tarrant grins. "Onions and goats! Sailors' stores, every one." Mr. Rowe
              nods. "Long enough to plant onions by the spring, and to leave their goats
              behind. Sailors carry both, and plant and keep them where they stay a while."
            proof:
              - clues: [C9]
                missing: >
                  Mr. Rowe nods. "That sounds right, Captain, but let's have proof. Look at
                  what grows by the spring, and what grazes above the beach, with the guides
                  from the chart house. Then call the council again."
          - text: All their lives. They never left.
            reply: >
              Kit looks around. "Then where are they all? Only one sailor lives on the
              island now."
      - id: went
        sets: crew_settled
        agreed: most of them sailed west in a boat they built, and one stayed
        question: >
          "Last: where are they now?"
        choices:
          - text: They all stayed, and their children live here now.
            reply: >
              Mr. Rowe shakes his head. "Then where is everybody? Only one sailor still
              lives on the island."
          - text: Most of them sailed west, in a boat they built here, and one stayed.
            right: true
            reply: >
              The whole crew cheer, and Ned Tarrant thumps the mast. "West, by thunder, in a
              boat of her own oak!" Mr. Rowe adds quietly: "With the trade wind behind
              them. And one of them never left."
            proof:
              - clues: [C8]
                missing: >
                  Mr. Rowe nods. "It could be, Captain, but built out of what? Something
                  was built from the Halcyon herself. Look closely at what the village is
                  built of. Then call the council again."
              - clues: [C11]
                missing: >
                  Kit pipes up. "The children here would remember how they left, Captain!
                  Listen to Tui's song. Then call the council again."
              - clues: [C13]
                missing: >
                  Mr. Rowe taps his logbook. "And one of them never left, Captain. Find him,
                  and hear it from him. Then call the council again."
          - text: They sailed home, east, and were lost on the way.
            reply: >
              Ned Tarrant snorts. "East, against the trade wind, for weeks, in a little
              boat? Not even I would try that. Ask the Good Hope about the wind out here:
              |wask hope about wind|n."
    summary: >
      The crew cheer until the gulls fly up from the reef.
      The Good Hope's timbers creak: "So the council agrees. The Halcyon was wrecked on the
      Western Reef in the great storm of '75. The islanders saved her whole crew, and most
      of
      them sailed west in a boat they built from her oak, while one stayed. That's what the
      Society asked, Captain. It's yours to write in the report, and yours to sign."
    concludes:
      wreck: >
        She was wrecked on the island's Western Reef, in the great storm of '75.
      crew: >
        The islanders saved the whole crew; most sailed west in a boat they built, and one
        stayed.
