# The expedition's report and the epilogue: `report`, anywhere, at any moment.
#
# SPOILERS: this file holds the solution of the mystery. Don't show it to the players.
#
# The report is the expedition's case board (DECISIONS.md, 29 and 32): the task's questions
# (clues.yaml, `task`), in the same order, each with the theories the expedition has come
# across so far. Players consult it whenever they wonder what to do, so it must show only what
# they could know. A theory `opens` with the evidence that raises it; without `opens`, it is
# what the Society believes at the start. The right theory never opens alone: some wrong
# theory of the same question has exactly the same `opens` (the content check makes sure), so
# a new theory never gives itself away by appearing. Theories are lettered a, b, c... among
# those open, in the order written here, so write the ones open from the start first.
#
# The wrong theories are what witnesses believe or claim (Barnaby's sinking, the chart being
# right), or a natural misunderstanding: choosing between them is the test of understanding
# (DECISIONS.md, 6b). Never invent a new element just to be wrong. Write the right theory as a
# claim, not an explanation: the why belongs in the epilogue and the connection questions.
# A reply must not mention what the players may not know yet when the theory is open (a theory
# open from the start can't speak of the island's reef).
#
# One player's answer counts for the whole expedition. A wrong theory is turned down with its
# `reply`: why it doesn't fit, and where to look. It is never a "you failed". The right one is
# accepted only when the journal holds its `proof`; until then the first missing proof's hint
# is shown. Once all questions are answered, the epilogue follows, page by page (`report
# more`). The game frames these texts: a wrong theory's reply is followed by "pick another
# answer, or find out more first", and a `missing` hint is preceded by "the journal doesn't
# hold the proof yet" and followed by "report this answer again". So write `missing` as a
# direction (where to look), not as a question. The game's verdict on an answer comes first,
# on its own line in cyan (DECISIONS.md, 20).
#
# `before` (optional) is all `report` says until the expedition has been given its task (the
# task's `after` flag in clues.yaml, DECISIONS.md, 33).
#
# Each question has:
#   id        a short name (also used by `report <id>`, for testing)
#   choices   two to five theories; exactly one has `right: true`
#
# Each choice (theory) has:
#   text      the theory as players read it
#   opens     optional: the clues that raise it, as in a connection's `needs` (an entry can
#             be a list: any one of those clues); without it, open from the start
#   reply     wrong theories: why it doesn't fit, and a hint where to look
#   right     true for the right theory; it then has, instead of `reply`:
#     answer  a short line for the journal, under the task's question
#     reply   what players read when it is accepted
#     proof   the clues that prove it: a list of groups, each one needing any one of its
#             `clues` in the journal; `missing` is the hint shown while a group isn't met
#
# One clue, one job (DECISIONS.md, 39): each part of a proof is one clue, the one that
# proves that part (GAME_STORY.md, "The clue chain"). Wreck site = C7; why not found = C4
# (the chart is wrong) + C10 (this is its island) + C5 (1 degree off); crew = C12 (saved) +
# C9 (stayed a season) + C8 (built with her oak) + C11 (sailed west) + C13 (one stayed).
#
# The epilogue's pages: `title` and `text`. Its facts are checked against the sources on its
# last page (DECISIONS.md, 9; GAME_STORY.md, "Sources").
#
# After editing, `reload` in the game is enough.

before: >
  The report is how you'll tell the Society what you have worked out from the clues in the
  journal. You haven't been given its questions yet: speak with Mrs. Fairweather, in the
  Society Office.

questions:
  - id: wreck
    choices:
      - text: She sank far out at sea in the great storm of '75, with all hands.
        reply: >
          That is what Old Barnaby believes, and he is right about the storm. But a ship that
          sinks far out at sea leaves nothing anyone can find, and something of the Halcyon
          has been found. Look closely at it.
      - text: She reached the island, then sailed on and was lost somewhere else.
        reply: >
          Her last letter does say "We sail again soon". But nobody knows that she did.
          Find the island first, and see what is there.
      - text: She never reached the island at all. The chart was only a guess.
        opens: [C4]
        reply: >
          The chart's island was drawn by someone who saw it: its coastline is drawn with
          care. Find a place where you can compare the drawing with an island.
      - text: She sank in the deep ocean, and the compass lay on the sea floor until someone
          found it.
        opens: [[C2, C7, C13]]
        reply: >
          Coral grows only in warm, clear, shallow water, never in the deep ocean, and
          nothing can be brought up from the bottom of the deep sea. The compass lay
          somewhere shallow, near land.
      - text: She was wrecked on a reef near the island, in the great storm of '75.
        opens: [[C2, C7, C13]]
        right: true
        answer: Wrecked on the island's Western Reef, in the great storm of '75.
        reply: >
          You write it down: the Halcyon was wrecked on the Western Reef, in the great storm
          of '75. Old Barnaby was right about the storm and wrong about the sinking.
        proof:
          - clues: [C7]
            missing: >
              Find the wreck itself. Something of her must still lie where she was lost.

  - id: why
    choices:
      - text: Because she sank in deep water, and the sea keeps what it takes.
        reply: >
          Even a ship lost without a trace leaves her island behind, and nobody found the
          island either. Sail to where the chart puts it, and see for yourselves.
      - text: Nobody searched long enough. The island is where the chart says it is.
        reply: >
          Then it will be there when you arrive. Sail to the position on the chart, and see
          for yourselves.
      - text: >
          Because the chart's latitude was wrong: the island lies further north or south than
          the chart says.
        opens: [C4]
        reply: >
          The noon sun says otherwise. The sextant measures latitude from the height of the
          noon sun, and it agrees with the chart. Which of the chart's two numbers is hard to
          measure?
      - text: >
          Because the chart's longitude was wrong: it put the island too far east or west.
        opens: [C4]
        right: true
        answer: >
          The chart's longitude was wrong: without a sea clock, the island was put 1 degree
          too far east.
        reply: >
          You write it down: the Halcyon's master measured his latitude by the noon sun,
          and it was right. His longitude was only reckoned, without a sea clock, and it put
          the island 1 degree too far east. Everyone who searched, searched in the wrong
          place.
        proof:
          - clues: [C4]
            missing: >
              Sail to the position written on the chart, and see for yourselves what is
              there.
          - clues: [C10]
            missing: >
              Show that this is the chart's island: compare its coastline with the chart,
              from somewhere high.
          - clues: [C5]
            missing: >
              Show how far the chart is out: measure the island's position with the sextant
              and the chronometer.
      - text: >
          Because the island moves. Phantom islands drift about the ocean, and appear and
          vanish.
        opens: [C4]
        reply: >
          Islands don't drift: an island is rock and earth, fixed to the bottom of the sea.
          What can move is the drawing of an island, from one place on a chart to another.
          Which of the chart's numbers could be wrong?

  - id: crew
    choices:
      - text: They all drowned when she went down.
        reply: >
          Old Barnaby believes it, but nobody has looked where the Halcyon was really lost.
          Find out where that was, and who lives there.
      - text: >
          They survived the wreck and lived on the island for a season. Most of them sailed
          west in a boat they built, and one stayed.
        opens: [[C8, C11, C12, C13]]
        right: true
        answer: >
          Saved by the islanders. They built a boat from the Halcyon's oak, and most sailed
          west; one stayed.
        reply: >
          You write it down: nobody drowned. The islanders saved the whole crew, and most of
          them sailed west in a boat built from the Halcyon's own oak, and reached a far port
          alive. Their families at home can stop waiting for a ship: their men are at sea.
        proof:
          - clues: [C12]
            missing: >
              Find someone on the island who remembers the night of the wreck.
          - clues: [C9]
            missing: >
              Look for what the crew left growing and grazing on the island: it shows how
              long they stayed.
          - clues: [C8]
            missing: >
              Look for something on the island that was built from the Halcyon herself.
          - clues: [C11]
            missing: >
              Listen to what the island's children remember about the sea people.
          - clues: [C13]
            missing: >
              Find the one of the crew who never left.
      - text: >
          They survived the wreck, built a boat and sailed home, east, but were lost on the
          way.
        opens: [[C8, C11, C12, C13]]
        reply: >
          Home lies east, and out here the trade wind blows from the east, day after day.
          Which way would a small boat really go? Someone on the island watched it leave.
      - text: They all stayed on the island, and their children live there now.
        opens: [[C8, C11, C12, C13]]
        reply: >
          Then where is everybody? Only one sailor still lives on the island. And something
          was built at the cove, and sailed away.

epilogue:
  - title: What happened
    text: >
      In 1775 the Halcyon found the island and charted it. A whaler put in for water, and
      the Halcyon's master sent his last letter home with her, and a fair copy of his
      chart.|/A week later the great storm of '75 blew out of the west. The Halcyon's anchors
      dragged, and she struck the Western Reef in the night. The islanders paddled out into
      the storm and brought the whole crew ashore, alive.|/The crew lived in the village for a
      season. With the islanders' help they built a boat from the Halcyon's oak, with island
      rope and a canvas sail. Most of them sailed west, and reached a Dutch trading port far
      away, where they signed on other ships. Word of it came back only to the island, years
      later, with a passing whaler: home never heard. Jonah Pike, the carpenter, stayed.
      He married, and the island
      became his home.|/The ship's compass stayed too, in the wreck on the reef, where coral
      grew over it. Fifteen years later island boys found it at low tide, and it travelled
      from island to island, eastward, until fishermen from the west traded it to Silas
      Crane.

  - title: How it all fits
    text: >
      Why nobody found her: The Earth turns 15 degrees every hour, so noon comes 4
      minutes later for every degree you go west. At the chart's position noon came 160
      minutes after noon at home: 40 degrees West, as the chart says. At the island it came
      164 minutes after: 41 degrees West. Four minutes on the clock, and about 108 km of sea,
      too far to see the island even from the masthead. The Halcyon had no sea clock, so her
      longitude was a reckoning, and it was 1 degree out. Her latitude, from the noon sun,
      was exact.|/Why the birds knew: White terns fish as far as a hundred miles from
      land and fly home at dusk. At the chart's position they flew west, and the island was
      there, half a day's sail away.|/Where she was lost: A wind out of the west drives a
      ship anchored off the island's west side onto the Western Reef. Her ribs are still
      there, grown over with coral.|/What became of the crew: No oak grows on a tropical
      island, so the oak beams in the village are the Halcyon's timber. Ships carried live
      goats and onions for long voyages, and both are still on the island. Coral grows only
      under the sea, and slowly: Crane's compass had lain on the reef with the wreck for
      years, not on a beach for one winter. And a child's song about a canoe with a white wing, flying to
      where the sun goes to sleep, is a sailing boat, going west.

  - title: The real story
    text: >
      This story is invented, but it is shaped like real ones.|/In 1788 the French explorer
      La Pérouse sailed into the Pacific with two ships and vanished. In 1826 an Irish
      captain, Peter Dillon, stopped at the island of Tikopia and noticed a silver sword
      guard, of French make. The islanders said it came from Vanikoro, an island nearby.
      There Dillon, and the French after him, found anchors and cannon on the reefs.
      The people of Vanikoro remembered that some of the sailors had survived, built a small
      boat and sailed away. Nobody knows what became of them.|/John Harrison's sea clocks
      solved the longitude problem: his H4 was tried at sea in 1761, and Captain Cook carried
      a copy of it, K1, on his second voyage, and called it his "never failing guide".|/And
      islands that were never there stayed on charts for a very long time. Sandy Island, in
      the Coral Sea, was reported by a whaling ship in 1876 and stayed on maps until 2012,
      when scientists sailed to its position and found only deep water.

  - title: Sources
    text: >
      Where the real facts in this story come from, if you want to read more:|/- Royal Museums
      Greenwich, on Harrison's timekeepers and Kendall's K1: rmg.co.uk|/- Peter Dillon, in the
      Australian Dictionary of Biography: adb.anu.edu.au/biography/dillon-peter-1978|/- The
      La Pérouse Expedition, 1785-1788, in the Solomon Islands Historical Encyclopaedia:
      solomonencyclopaedia.net|/- M. Seton and others, "Obituary: Sandy Island (1876-2012)",
      Eos 94 (2013)|/- Seabirds as signs of land: the Polynesian Voyaging Society,
      archive.hokulea.com/navigate/land.html, and the Science Learning Hub,
      sciencelearn.org.nz|/- To read: Dava Sobel, "Longitude" (1995), the story of John
      Harrison's clocks.
