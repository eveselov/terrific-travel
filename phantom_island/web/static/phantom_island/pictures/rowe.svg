<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Mr. Rowe with his logbook">
  <!-- Mr. Rowe, the mate: tall and quiet, blue coat, a logbook under his arm and a pencil
       behind his ear. Same style as crane.svg. -->
  <title>Mr. Rowe with his logbook</title>
  <rect x="6" y="6" width="468" height="288" rx="14" fill="#f3e6c4" stroke="#7a4a21" stroke-width="6"/>

  <!-- The Deck: planks, a mast and rigging -->
  <rect x="14" y="246" width="452" height="42" fill="#c9a96e"/>
  <path d="M14 246 H466 M14 260 H466 M14 274 H466" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="370" y="20" width="16" height="226" fill="#8b5a2b" stroke="#3b2a14" stroke-width="2"/>
  <path d="M378 30 L300 246 M378 30 L456 246 M378 60 L320 246" fill="none" stroke="#5b4632" stroke-width="1.5"/>

  <!-- Rowe: tall, long blue coat -->
  <g stroke="#3b2a14" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M190 246 L196 140 C200 124 216 116 232 116 C248 116 264 124 268 140 L274 246 Z" fill="#2f4a6b"/>
    <path d="M222 116 L232 150 L242 116" fill="#e8dcc0"/>
    <path d="M232 150 V240" fill="none" stroke-width="2"/>
    <circle cx="226" cy="170" r="2.5" fill="#d4a017"/>
    <circle cx="226" cy="196" r="2.5" fill="#d4a017"/>
    <circle cx="226" cy="222" r="2.5" fill="#d4a017"/>
    <ellipse cx="232" cy="84" rx="22" ry="27" fill="#e2b98f"/>
    <path d="M210 78 C210 54 254 54 254 78 C246 66 218 66 210 78 Z" fill="#5b4632"/>
    <path d="M222 86 h7 M236 86 h7" fill="none" stroke-width="2"/>
    <circle cx="225" cy="90" r="2" fill="#3b2a14"/>
    <circle cx="240" cy="90" r="2" fill="#3b2a14"/>
    <path d="M226 104 h12" fill="none" stroke-width="2"/>
    <!-- The pencil behind his ear -->
    <path d="M252 70 L268 96" stroke="#d4a017" stroke-width="4"/>
    <!-- The logbook under his arm -->
    <rect x="252" y="150" width="34" height="46" fill="#7a4a21" transform="rotate(10 269 173)"/>
    <path d="M258 158 h22" stroke="#c9a96e" stroke-width="2" transform="rotate(10 269 173)"/>
  </g>
</svg>
