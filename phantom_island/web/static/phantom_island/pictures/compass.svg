<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A brass compass engraved HALCYON">
  <!-- The brass compass on Crane's stall: needle north, HALCYON engraved on the open lid.
       No coral: that is for `examine compass` to find (C2). Same style as crane.svg. -->
  <title>A brass compass engraved HALCYON</title>
  <rect x="6" y="6" width="468" height="288" rx="14" fill="#f3e6c4" stroke="#7a4a21" stroke-width="6"/>

  <!-- The stall's cloth -->
  <path d="M14 230 H466 V288 H14 Z" fill="#a8452e" opacity="0.55"/>
  <path d="M14 230 H466" stroke="#7a4a21" stroke-width="2"/>

  <!-- The open lid, standing up behind, engraved -->
  <g stroke="#3b2a14" stroke-width="3">
    <ellipse cx="240" cy="92" rx="92" ry="62" fill="#d4a017"/>
    <ellipse cx="240" cy="92" rx="78" ry="50" fill="#e3b93a" stroke="#a8803f" stroke-width="2"/>
  </g>
  <text x="240" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" letter-spacing="2" fill="#7a4a21">HALCYON</text>
  <!-- The hinge -->
  <rect x="222" y="148" width="36" height="12" rx="4" fill="#a8803f" stroke="#3b2a14" stroke-width="2.5"/>

  <!-- The bowl and the card, needle swinging north -->
  <g stroke="#3b2a14" stroke-width="3">
    <ellipse cx="240" cy="196" rx="100" ry="40" fill="#d4a017"/>
    <ellipse cx="240" cy="192" rx="82" ry="30" fill="#f3e6c4" stroke="#a8803f" stroke-width="2"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#3b2a14" text-anchor="middle">
    <text x="240" y="174">N</text>
    <text x="240" y="220">S</text>
    <text x="174" y="197">W</text>
    <text x="306" y="197">E</text>
  </g>
  <path d="M240 172 L248 192 L240 212 L232 192 Z" fill="#f3e6c4" stroke="#3b2a14" stroke-width="2"/>
  <path d="M240 172 L248 192 L232 192 Z" fill="#a8452e" stroke="#3b2a14" stroke-width="2"/>
  <circle cx="240" cy="192" r="3" fill="#3b2a14"/>
</svg>
