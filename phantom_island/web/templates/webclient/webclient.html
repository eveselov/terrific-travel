{% extends "webclient/base.html" %}
{% load static %}
<!--
Phantom Island: replaces Evennia's evennia/web/templates/webclient/webclient.html.
The "client" block is copied unchanged from Evennia 6.1. The only additions are in the
"scripts" block: the Map and Focus panes' plugin and stylesheet (which also echo the
player's commands).

The "?v=" in their URLs makes browsers fetch them again instead of using a cached copy.
Bump it (ASSET_VERSION below) whenever panes.js or panes.css changes.
The stylesheet is linked here rather than in Evennia's custom.css because this block comes
after all of Evennia's stylesheets, so its rules win without tricks.
-->

{% block client %}

<!-- Basic toolbar -->
<div id="toolbar"></div>

<!-- "Main" Content -->
<div id="main"  class="split split-vertical" data-role-default>
  <div id="main-sub" class="split-sub">
    <div id="messagewindow"></div>
  </div>
</div>

<!-- "Input" Pane -->
<div id="input" class="split split-vertical" data-role-input data-update-append>
  <div id="inputform" class="wrapper">
    <div id="prompt" class="prompt">
    </div>
    <div id="inputcontrol" class="input-group">
      <textarea id="inputfield" type="text" class="form-control"></textarea>
      <span class="input-group-btn">
        <button class="btn btn-large btn-outline-primary" id="inputsend" type="button" value="">&gt;</button>
      </span>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
{% with ASSET_VERSION="4" %}
<link rel="stylesheet" type="text/css" media="screen" href="{% static 'phantom_island/css/panes.css' %}?v={{ ASSET_VERSION }}">
<script src="{% static 'webclient/js/plugins/panes.js' %}?v={{ ASSET_VERSION }}" type="text/javascript"></script>
{% endwith %}
{% endblock %}
